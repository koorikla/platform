# Local management cluster platform-mgmt (`bootstrap/bootstrap.sh up`). On docker network kind next to the CAPD
# workload clusters, with the docker socket mounted so CAPD can create their containers.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: platform-mgmt
servers: 1
agents: 0
# Same k3s as the workload clusters, pinned by multi-arch index digest.
image: docker.io/rancher/k3s:v1.35.10-k3s1@sha256:8262ca99a558dca0c0437443421986480b2359f9118f2371359f88a41514522f
network: kind
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # Embedded etcd even with one server: kine/SQLite compaction failed on a busy mgmt and crash-looped k3s (#76).
      - arg: --cluster-init
        nodeFilters:
          - server:0
      # No fsync in the mgmt etcd: fsync stalls over 30 s made k3s exit during bootstrap (#344). Only a host crash can
      # lose recent writes, and the lab is then rebuilt with `task down up`.
      - arg: --etcd-arg=unsafe-no-fsync=true
        nodeFilters:
          - server:0
      # Longer leader election (upstream 15s/10s/2s) rides out bootstrap I/O stalls; equal to charts/cluster
      # k3s.dockerLeaderElectionArgs (#82, kept equal by hack/tests/test_gitops_contracts.sh).
      - arg: --kube-controller-manager-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-lease-duration=60s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-renew-deadline=40s
        nodeFilters: [server:*]
      - arg: --kube-cloud-controller-manager-arg=leader-elect-retry-period=10s
        nodeFilters: [server:*]
# k3s's own leases (wrangler, upstream 45 s / 30 s): one server, nothing fails over, so ride out 90 s stalls (#344).
env:
  - envVar: CATTLE_ELECTION_LEASE_DURATION=120s
    nodeFilters: [server:*]
  - envVar: CATTLE_ELECTION_RENEW_DEADLINE=90s
    nodeFilters: [server:*]
  - envVar: CATTLE_ELECTION_RETRY_PERIOD=10s
    nodeFilters: [server:*]
volumes:
  - volume: /var/run/docker.sock:/var/run/docker.sock
    nodeFilters:
      - server:*
ports:
  # OpenChoreo console, API, and Thunder (HTTP over kgateway)
  - port: 127.0.0.1:8080:8080   # loopback only: tailscaled holds :8443 on the tailnet IP of this host
    nodeFilters:
      - loadbalancer
  # OpenChoreo cluster-gateway (TLS passthrough from workload cluster-agents)
  - port: 127.0.0.1:8443:8443   # agents reach it over docker network kind, not the host port
    nodeFilters:
      - loadbalancer
  # OpenChoreo observability Gateway: HTTP (observer, OTLP, Prometheus remote write) and TLS passthrough (OpenSearch)
  - port: 127.0.0.1:11080:11080
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:11085:11085
    nodeFilters:
      - loadbalancer
  # Harbor registry: UI and docker login/push/pull at https://harbor.openchoreo.localhost:9443 (CAPD nodes too).
  - port: 127.0.0.1:9443:9443
    nodeFilters:
      - loadbalancer
  # OpenBao, the Istio mesh CA (installation.yaml mesh.ca.port): for CAPD mesh members; the host only for debugging.
  - port: 127.0.0.1:8200:8200
    nodeFilters:
      - loadbalancer
