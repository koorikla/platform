# Answers every name under openchoreo.controlPlane.host with the address of `rewrite.target`, through k3s's optional
# ConfigMap kube-system/coredns-custom. Targets per role and name: README.md "Design notes".

# Catalog providers: [docker, byo]. A byo cluster brings its own DNS, so values/provider-byo.yaml turns this off; the
# local installation turns it back on (installations/local/addons/coredns-local/values.yaml): its byo clusters are k3d
# containers on network `kind` too.
enabled: true

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
openchoreo:
  controlPlane:
    # -- Control-plane base domain (`openchoreo.localhost`).
    host: openchoreo.localhost
  observability:
    enabled: false

rewrite:
  # -- `gateway-default.openchoreo-control-plane.svc.cluster.local` on `mgmt`; `k3d-platform-mgmt-serverlb` on CAPD workload clusters.
  target: k3d-platform-mgmt-serverlb   # overridden per role

observabilityRewrite:
  # -- Optional `mgmt` CNAME rewrite for observability (alongside `registryRewrite.target` for Harbor when `registry.type: harbor`).
  target: ""                           # mgmt: the obs-plane Gateway Service (values/role-mgmt.yaml)

registry:                              # installation.yaml (defaults for standalone renders)
  type: external
  host: ""
registryRewrite:
  target: ""                           # mgmt: Harbor's Gateway Service (values/role-mgmt.yaml)
