# Argo CD on mgmt. bootstrap/bootstrap.sh installs it with these same values, so the GitOps Application adopts it cleanly.
# Every argocd component pins the same tag@digest via the anchor below (not global.image.tag, which also feeds the
# version label); a chart bump updates it and redis together (docs/conventions.md invariant 9).
argo-cd:
  fullnameOverride: argocd
  global:
    domain: localhost
    networkPolicy:
      create: false
  configs:
    params:
      server.insecure: true
      # -- `true` so CAPI, ESO, cert-manager, and OpenChoreo CRD defaults do not cause permanent diffs.
      controller.diff.server.side: true
      # -- Upstream defaults (20/10): ~45 apps converge at once on a clean bootstrap; 10/5 queued them.
      controller.status.processors: 20
      controller.operation.processors: 10
    cm:
      # -- `"true"` so `repo-server` builds HTTPS and OCI wrapper dependencies (`ARGOCD_EXEC_TIMEOUT=180s`).
      helm.dependencies.enabled: "true"
      # -- Upstream default 120s. An app whose first comparison fails (a new workload cluster's Argo secret lands before
      # its API serves) is only retried on this period: with 300s+60s jitter dev1's addons idled ~8 min.
      timeout.reconciliation: 120s
      timeout.reconciliation.jitter: 30s
      # Thunder's PreSync setup Job mounts a PVC that k3s local-path binds only on first consumer.
      # -- Treats `Pending` `WaitForFirstConsumer` PVCs as `Healthy` so hook Jobs can bind volumes.
      resource.customizations.health.PersistentVolumeClaim: |
        hs = {}
        if obj.status ~= nil and obj.status.phase ~= nil then
          if obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          if obj.status.phase == "Pending" then
            hs.status = "Healthy"
            hs.message = "Waiting for first consumer (WaitForFirstConsumer)"
            return hs
          end
        end
        hs.status = "Progressing"
        return hs
      # Kyverno 1.20 never sets conditionStatus.ready on DeletingPolicies, which Argo CD 3.6 reads as Degraded:
      # Healthy unless Kyverno reports a failure.
      resource.customizations.health.policies.kyverno.io_DeletingPolicy: &deletingPolicyHealth |
        hs = {}
        local cs = nil
        if obj.status ~= nil then
          cs = obj.status.conditionStatus
        end
        if cs ~= nil then
          if cs.conditions ~= nil then
            for _, c in ipairs(cs.conditions) do
              if c.status == "False" then
                hs.status = "Degraded"
                hs.message = c.type .. ": " .. (c.message or "")
                return hs
              end
            end
          end
          if cs.ready == false then
            hs.status = "Degraded"
            hs.message = (cs.message ~= nil and cs.message ~= "") and cs.message or "Policy is not ready"
            return hs
          end
        end
        hs.status = "Healthy"
        if obj.status ~= nil and obj.status.lastExecutionTime ~= nil then
          hs.message = "Last run " .. obj.status.lastExecutionTime
        else
          hs.message = "Scheduled, not run yet"
        end
        return hs
      resource.customizations.health.policies.kyverno.io_NamespacedDeletingPolicy: *deletingPolicyHealth
      # CAPI 1.13 sets ResourcesApplied only once a Cluster matches, which Argo CD 3.6 reads as Progressing forever
      # (#192): reconciled without ResourcesApplied = nothing matches = Healthy; otherwise as upstream.
      resource.customizations.health.addons.cluster.x-k8s.io_ClusterResourceSet: |
        hs = {}
        local reconciled = false
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "ResourcesApplied" then
              if c.status == "True" then
                hs.status = "Healthy"
                hs.message = "cluster resource set is applied"
              elseif c.status == "False" then
                hs.status = "Degraded"
                hs.message = (c.message ~= nil and c.message ~= "") and c.message or (c.reason or "not applied")
              else
                hs.status = "Progressing"
                hs.message = c.message or "applying"
              end
              return hs
            end
            if c.observedGeneration ~= nil and obj.metadata.generation ~= nil
                and c.observedGeneration >= obj.metadata.generation then
              reconciled = true
            end
          end
        end
        if reconciled then
          hs.status = "Healthy"
          hs.message = "No cluster matches the selector: nothing to apply"
        else
          hs.status = "Progressing"
          hs.message = "Initializing cluster resource set"
        end
        return hs
  controller:
    image:
      # -- Argo CD image tag pinned by multi-arch index digest (shared across `controller`, `server`, `repoServer`, `applicationSet`, `dex`, `notifications`).
      tag: &argocdTag v3.6.1@sha256:296e3d74f449b2ce45265613fcb68c18ed7366488360c8ea32f5f2a93d2e5c54   # index: amd64, arm64, ppc64le, s390x
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  server:
    image: { tag: *argocdTag }
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  repoServer:
    image: { tag: *argocdTag }
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "180s"   # allow initial OCI/https helm dependency builds (e.g. openchoreo-control-plane)
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  applicationSet:
    enabled: true
    image: { tag: *argocdTag }
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  redis:
    image:   # chart default repository (ECR Public mirror of Docker Official redis)
      tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763   # index: amd64, arm64, arm, ...
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  dex:
    enabled: false
    initImage: { tag: *argocdTag }
  notifications:
    enabled: false
    image: { tag: *argocdTag }
  commitServer:
    image: { tag: *argocdTag }
  redisSecretInit:
    image: { tag: *argocdTag }
