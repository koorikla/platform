# ThunderID on mgmt: OpenChoreo 1.3.3 install/k3d/common/values-thunder.yaml under `thunderid:`, deviations marked
# "platform:". Secrets, hook order and PVC protection: README.md "Design notes".

bootstrapSecret:
  # -- Pulls OIDC client and admin secrets (`bootstrapSecret.{store,remoteKey,observabilityRemoteKey,promotionGate}`) from `ClusterSecretStore/platform` into `thunder-bootstrap`.
  store: platform           # ClusterSecretStore
  remoteKey: openchoreo     # flat key, see header
  name: thunder-bootstrap   # Secret consumed by thunderid.setup (admin.passwordRef, secretEnv)
  # OAuth clients of OpenChoreo's AI agents (docs/ai-agents.md): rca | finops. Each adds <agent>-agent-client-secret,
  # read from key `openchoreo-ai` property <agent>-oauth-client-secret: the same property the agent's own Secret uses
  # (addon openchoreo-observability-plane), so both sides always agree, and switches on its Thunder client script
  # (files/ai-agent-clients/, templates/ai-agent-clients.yaml). Nothing else to edit.
  aiAgentClients: []
  aiRemoteKey: openchoreo-ai
  observabilityRemoteKey: openchoreo-observability   # observer-client-secret (script 59)
  # client-secret of OAuth client openchoreo-promotion-gate (script 70) == addon openchoreo-platform
  # promotionGate.clientSecret (same store key: the gate posts it to Thunder's token endpoint)
  promotionGate: { remoteKey: promotion-gate, property: client-secret }

# --- installation.yaml (defaults so `helm template` works standalone); templates/validate.yaml checks the hostname -
openchoreo:
  controlPlane:
    host: openchoreo.localhost

thunderid:
  fullnameOverride: thunder

  deployment:
    # -- `1` (single-writer SQLite persistence) with `1.0.1` pinned by multi-arch index digest.
    replicaCount: 1           # SQLite: single writer
    image:
      tag: 1.0.1@sha256:d3c0613ff447a551fd440768a15bdfb6668948e80809cbb50f82d6752f22ab3e   # multi-arch index digest: amd64, arm64
      pullPolicy: IfNotPresent   # platform: chart default Always
  hpa:
    enabled: false
  ingress:
    enabled: false            # no ingress-nginx: the HTTPRoute below on the OpenChoreo control-plane Gateway
  httproute:
    # -- Exposes `thunder.<openchoreo.controlPlane.host>` via `openchoreo-control-plane/gateway-default`.
    enabled: true
    parentRefs:
      - name: gateway-default
        namespace: openchoreo-control-plane
    hostnames:
      - thunder.openchoreo.localhost

  # platform: never drop hook-failed, or Argo CD deletes the PVCs before every sync (BeforeHookCreation); the
  # delete-protection VAP covers failed syncs. hack/tests/test_pvc_hooks.sh.
  persistence:
    annotations:
      helm.sh/hook-delete-policy: hook-failed
      platform.koorikla.io/delete-protection: enabled
  certs:
    persistence:
      annotations:
        helm.sh/hook-delete-policy: hook-failed
        platform.koorikla.io/delete-protection: enabled
  secrets:
    persistence:
      annotations:
        helm.sh/hook-delete-policy: hook-failed
        platform.koorikla.io/delete-protection: enabled

  configuration:
    server:
      httpOnly: true
      publicUrl: "http://thunder.openchoreo.localhost:8080"
    gateClient:
      hostname: "thunder.openchoreo.localhost"
      port: 8080
      scheme: "http"
    # platform: password "" - the chart default "dbpassword" (postgres) would render an unused hook Secret
    database:
      config:
        type: sqlite
        postgres: { password: "" }
      runtime_transient:
        type: sqlite
        postgres: { password: "" }
      entity:
        type: sqlite
        postgres: { password: "" }
      runtime_persistent:
        type: sqlite
        postgres: { password: "" }
    passkey:
      allowedOrigins:
        - "http://openchoreo.localhost:8080"

  setup:
    enabled: true
    # platform: no hook-delete-policy and no ttl, so each sync replaces the previous Job (upstream left a failed Job that
    # Argo re-reported instead of re-running). The last run stays for `kubectl logs job/thunder-setup`.
    preserveJob: true
    admin:
      passwordRef: { name: thunder-bootstrap, key: thunder-admin-password }   # platform: no lookup()-generated Secret
    secretEnv:
      - { name: OPENCHOREO_ADMIN_PASSWORD, secretName: thunder-bootstrap, secretKey: admin-user-password }
      - { name: OPENCHOREO_DEVELOPER_PASSWORD, secretName: thunder-bootstrap, secretKey: developer-user-password }
      - { name: BACKSTAGE_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: backstage-client-secret }
      - { name: SERVICE_MCP_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: service-mcp-client-secret }
      - { name: OBSERVER_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: observer-client-secret }
      - { name: PROMOTION_GATE_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: promotion-gate-client-secret }
      # AI agent clients (docs/ai-agents.md): the keys exist only for agents in bootstrapSecret.aiAgentClients (optional),
      # and only those agents' scripts reference them (templates/ai-agent-clients.yaml).
      - { name: RCA_AGENT_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: rca-agent-client-secret, optional: true }
      - { name: FINOPS_AGENT_CLIENT_SECRET, secretName: thunder-bootstrap, secretKey: finops-agent-client-secret, optional: true }
    # Scripts 53 / 60 (AI agent OAuth clients, templates/ai-agent-clients.yaml): only agents listed in
    # bootstrapSecret.aiAgentClients get a file, because Thunder fails on an empty or comment-only document.
    extraVolumes:
      - name: ai-agent-clients
        configMap:
          name: thunder-ai-agent-clients
          optional: true      # = per-key: a key missing from the ConfigMap is skipped instead of failing the pod
          items:
            - { key: README, path: ai-agent-clients/README }
            - { key: 53-rca-agent-client.yaml, path: ai-agent-clients/53-rca-agent-client.yaml }
            - { key: 60-finops-agent-client.yaml, path: ai-agent-clients/60-finops-agent-client.yaml }
    extraVolumeMounts:
      - { name: ai-agent-clients, mountPath: /opt/thunderid/bootstrap/ai-agent-clients, subPath: ai-agent-clients, readOnly: true }

  # Documents the setup Job upserts by fixed id (01900000-0000-7000-8001-*; platform clients 70+ from ...0100). Upstream
  # 48-51, 54 kept; clients for components not installed here dropped (add one back with its feature); 53/60 above.
  bootstrap:
    scripts:
      # A path override replaces ThunderID's shipped entry: every directive except img-src mirrors the 1.0.1 defaults.
      48-csp.yaml: |
        resource_type: server_config
        name: csp
        value:
          paths:
            - location: "/gate/"
              directives:
                img-src:
                  - "'self'"
                  - "data:"
                  - "https://cdn.statically.io"
                  - "https://raw.githubusercontent.com"
                font-src:
                  - "'self'"
                  - "data:"
                style-src-attr:
                  - "'self'"
                  - "'unsafe-inline'"
                style-src-elem:
                  - "'self'"
            - location: "/console/"
              directives:
                img-src:
                  - "'self'"
                  - "data:"
                  - "https://cdn.statically.io"
                  - "https://raw.githubusercontent.com"
                font-src:
                  - "'self'"
                  - "data:"
                connect-src:
                  - "'self'"
                  - "https://thunderid.dev"
                style-src-attr:
                  - "'self'"
                  - "'unsafe-inline'"
                style-src-elem:
                  - "'self'"
                  - "'unsafe-inline'"
                worker-src:
                  - "'self'"
                  - "blob:"

      49-cors.yaml: |
        resource_type: server_config
        name: cors
        value:
          allowedOrigins:
            - "http://openchoreo.localhost:8080"

      50-user-schema-and-users.yaml: |
        resource_type: user_type
        id: 01900000-0000-7000-8001-000000000010
        category: user
        name: openchoreo-user
        ouHandle: default
        allowSelfRegistration: false
        systemAttributes:
          display: username
        schema:
          username:
            type: string
            displayName: Username
            required: true
            unique: true
          password:
            type: string
            displayName: Password
            required: false
            credential: true
          given_name:
            type: string
            displayName: First Name
            required: true
          family_name:
            type: string
            displayName: Last Name
            required: true
          email:
            type: string
            displayName: Email
            required: true
            unique: true
        ---
        resource_type: user
        id: 01900000-0000-7000-8001-000000000030
        type: openchoreo-user
        ouHandle: default
        attributes:
          username: admin@openchoreo.dev
          email: admin@openchoreo.dev
          given_name: Admin
          family_name: User
        credentials:
          password: "{{ .OPENCHOREO_ADMIN_PASSWORD }}"
        ---
        resource_type: user
        id: 01900000-0000-7000-8001-000000000031
        type: openchoreo-user
        ouHandle: default
        attributes:
          username: developer@openchoreo.dev
          email: developer@openchoreo.dev
          given_name: Developer
          family_name: User
        credentials:
          password: "{{ .OPENCHOREO_DEVELOPER_PASSWORD }}"
        ---
        resource_type: group
        id: 01900000-0000-7000-8001-000000000040
        name: admins
        description: Openchoreo Admins group
        ouHandle: default
        members:
          - id: 01900000-0000-7000-8001-000000000030
            type: user
        ---
        resource_type: group
        id: 01900000-0000-7000-8001-000000000041
        name: developers
        description: Openchoreo Developers group
        ouHandle: default
        members:
          - id: 01900000-0000-7000-8001-000000000031
            type: user
        ---
        resource_type: group
        id: 01900000-0000-7000-8001-000000000042
        name: demo-developers
        description: Developers of OpenChoreo project demo (platform, DEMO; charts/tenant developerGroups default)
        ouHandle: default
        members:
          - id: 01900000-0000-7000-8001-000000000031
            type: user

      51-backstage-app.yaml: |
        resource_type: application
        id: 01900000-0000-7000-8001-000000000060
        ouId: 01900000-0000-7000-8000-000000000001
        name: Backstage
        type: fullstack
        authFlowId: 01900000-0000-7000-8000-000000000061
        description: OpenChoreo Backstage Portal
        logoUrl: "https://cdn.statically.io/gh/openchoreo/openchoreo.github.io@main/static/img/openchoreo-logo.png"
        allowedUserTypes:
          - openchoreo-user
        assertion:
          validityPeriod: 3600
        inboundAuthConfig:
          - type: oauth2
            config:
              clientId: openchoreo-backstage-client
              clientSecret: "{{ .BACKSTAGE_CLIENT_SECRET }}"
              redirectUris:
                - "http://openchoreo.localhost:8080/api/auth/openchoreo-auth/handler/frame"
              grantTypes:
                - authorization_code
                - client_credentials
                - refresh_token
              responseTypes:
                - code
              tokenEndpointAuthMethod: client_secret_post
              pkceRequired: false
              publicClient: false
              token:
                accessToken:
                  userConfig:
                    validityPeriod: 86400
                    attributes:
                      - given_name
                      - family_name
                      - username
                      - groups
                  clientConfig:
                    validityPeriod: 86400
                idToken:
                  validityPeriod: 86400
                  userAttributes:
                    - given_name
                    - family_name
                    - username
                    - groups
              scopeClaims:
                email:
                  - email
                groups:
                  - groups
                profile:
                  - username
                  - given_name
                  - family_name
                  - picture

      # Upstream 57 (headless MCP clients -> openchoreo-api / observer, client_credentials); secret from the store.
      # Bound in openchoreo-control-plane to ClusterAuthzRole mcp-service (read-only + workflowrun:create) instead of
      # upstream's admin (docs/ai-agents.md).
      57-service-mcp-app.yaml: |
        resource_type: application
        id: 01900000-0000-7000-8001-000000000066
        ouId: 01900000-0000-7000-8000-000000000001
        name: Service MCP App
        type: mcp
        description: Service MCP app to be used by backend services which can securely store the secret
        inboundAuthConfig:
          - type: oauth2
            config:
              clientId: service_mcp_client
              clientSecret: "{{ .SERVICE_MCP_CLIENT_SECRET }}"
              grantTypes:
                - client_credentials
              tokenEndpointAuthMethod: client_secret_basic
              pkceRequired: false
              publicClient: false
              token:
                accessToken:
                  clientConfig:
                    validityPeriod: 3600

      # Upstream 59 (observability plane's observer -> control plane API, client_credentials); secret from the store.
      59-openchoreo-observer-app.yaml: |
        resource_type: application
        id: 01900000-0000-7000-8001-000000000068
        ouId: 01900000-0000-7000-8000-000000000001
        name: OpenChoreo Observer Resource Reader
        type: m2m
        description: OpenChoreo Observer Resource Reader Client
        inboundAuthConfig:
          - type: oauth2
            config:
              clientId: openchoreo-observer-resource-reader-client
              clientSecret: "{{ .OBSERVER_CLIENT_SECRET }}"
              grantTypes:
                - client_credentials
              tokenEndpointAuthMethod: client_secret_post
              pkceRequired: false
              publicClient: false
              token:
                accessToken:
                  clientConfig:
                    validityPeriod: 3600

      # Platform: the promotion gate (ClusterWorkflow promotion-gate, addon openchoreo-platform) -> OpenChoreo API and
      # observer, client_credentials like 59. Its permissions are the ClusterAuthzRoleBinding promotion-gate-binding
      # (entitlement claim client_id, addon openchoreo-platform templates/promotion-authz.yaml). Token lifetime = the
      # gate's activeDeadlineSeconds. clientId == openchoreo-platform promotionGate.clientID (hack/tests contract).
      70-openchoreo-promotion-gate-app.yaml: |
        resource_type: application
        id: 01900000-0000-7000-8001-000000000100
        ouId: 01900000-0000-7000-8000-000000000001
        name: OpenChoreo Promotion Gate
        type: m2m
        description: Promotion gate workflow - read-only OpenChoreo API and observer queries (docs/promotion.md)
        inboundAuthConfig:
          - type: oauth2
            config:
              clientId: openchoreo-promotion-gate
              clientSecret: "{{ .PROMOTION_GATE_CLIENT_SECRET }}"
              grantTypes:
                - client_credentials
              tokenEndpointAuthMethod: client_secret_post
              pkceRequired: false
              publicClient: false
              token:
                accessToken:
                  clientConfig:
                    validityPeriod: 900

      54-cli-app.yaml: |
        resource_type: application
        id: 01900000-0000-7000-8001-000000000063
        ouId: 01900000-0000-7000-8000-000000000001
        name: OpenChoreo CLI
        type: custom
        authFlowId: 01900000-0000-7000-8000-000000000061
        description: OpenChoreo CLI Default Application
        logoUrl: "https://cdn.statically.io/gh/openchoreo/openchoreo.github.io@main/static/img/openchoreo-logo.png"
        allowedUserTypes:
          - openchoreo-user
        assertion:
          validityPeriod: 3600
        inboundAuthConfig:
          - type: oauth2
            config:
              clientId: openchoreo-cli
              redirectUris:
                - "http://127.0.0.1:55152/auth-callback"
              grantTypes:
                - authorization_code
                - refresh_token
              responseTypes:
                - code
              tokenEndpointAuthMethod: none
              pkceRequired: true
              publicClient: true
              token:
                accessToken:
                  userConfig:
                    validityPeriod: 3600
                    attributes:
                      - given_name
                      - family_name
                      - username
                      - groups
                idToken:
                  validityPeriod: 3600
                  userAttributes:
                    - given_name
                    - family_name
                    - username
                    - groups
              scopeClaims:
                email:
                  - email
                groups:
                  - groups
                profile:
                  - username
                  - given_name
                  - family_name
                  - picture
                  - groups
