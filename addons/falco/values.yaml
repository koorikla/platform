# Falco (modern_ebpf) on every cluster + falcosidekick fan-out + Falco Talon response on workload clusters.
# Outputs and the local shared-kernel caveat: README.md "Design notes"; docs/observability.md "Falco".

# --- generated by the addon ApplicationSet (defaults so `helm template` works standalone) ---------------------------
cluster:
  name: default

# --- platform glue (templates/) -------------------------------------------------------------------------------------
# falcosidekick outputs with credentials (templates/outputs-secret.yaml), read through optional secretKeyRef env vars
# (falco.falcosidekick.config.extraEnv), so an output without its Secret simply has no env var.
secretStore: default             # slack (mgmt: `platform`, set per role)
# Escalation -> addon argo-events on mgmt, POST <url>/<cluster> with this cluster's own token (docs/observability.md
# "Falco response"). Secret falcosidekick-escalation: store "" = delivered by mgmt (workload clusters: charts/cluster
# ClusterResourceSet <cluster>-falco-escalation; the store key falco-webhook never reaches the cluster); mgmt
# (values/role-mgmt.yaml) renders it from store `platform`, key remoteKey (url, token).
escalation:
  # -- Pulls webhook secrets (`escalation.{enabled,remoteKey}` for `falco-webhook`, `slack.{enabled,remoteKey}` for `falco-slack`) via ESO.
  enabled: true
  store: ""
  remoteKey: falco-webhook
slack:
  enabled: false                 # falco-slack: property webhook-url
  remoteKey: falco-slack
  minimumPriority: warning

falco:
  fullnameOverride: falco        # stable names regardless of the Argo release name
  # Images: chart default registries (docker.io/falcosecurity), tag@digest pinned by multi-arch index digest
  # (docs/conventions.md invariant 9). The falcosidekick chart's `helm test` pod (hardcoded curlimages/curl) is never
  # created by Argo CD (Helm test hooks are unsupported there): listed exception in hack/tests/test_image_pins.sh.
  image:
    tag: 0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e   # index: amd64, arm64
  falcoctl:
    image:
      tag: 0.14.3@sha256:2230fb4802aafe09455b58d38f8f1faedd8f09f042e9a18fffd397e63488c023   # index: amd64, arm64
  driver:
    enabled: true
    # -- `modern_ebpf` (`loader.enabled: false`).
    kind: modern_ebpf
    loader:
      enabled: false             # modern eBPF is built into Falco (CO-RE): no driver download/build init container
  tty: false
  resources:                     # upstream requests 100m/512Mi, limits 1/1Gi
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }
  collectors:
    containerEngine:
      engines:
        docker:
          enabled: false         # mgmt k3d nodes mount the HOST docker.sock (for CAPD): don't enrich from it
        podman:
          enabled: false
    kubernetes:
      enabled: false             # k8smeta collector off: the container plugin already adds k8s.ns.name / k8s.pod.name (k3s CRI socket)
  falco:
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    priority: notice
    http_output:
      enabled: true
      url: http://falco-falcosidekick:2801   # == falcosidekick.fullnameOverride
  customRules:
    platform-rules.yaml: |-
      # Platform rules (koorikla/platform addons/falco). App namespaces = OpenChoreo data-plane namespaces
      # dp-<org>-<project>-<env>-<hash>. Talon acts on these rule names (falco-talon.config.rulesOverride).
      - list: platform_namespaces
        items: [kube-system, kube-public, kube-node-lease, local-path-storage, falco, telemetry, obi, cert-manager,
                external-secrets, argocd, fleet, capi-system, capi-operator-system, capd-system, caaph-system,
                capi-k3s-bootstrap-system, capi-k3s-control-plane-system, capa-system, caph-system, thunder,
                openchoreo-system, openchoreo-control-plane, openchoreo-data-plane, openchoreo-observability-plane,
                openchoreo-workflow-plane, cilium, istio-system, kyverno, argo-events]
      - macro: platform_app_namespace
        condition: (k8s.ns.name startswith "dp-")

      # CAPD (provider docker): each workload-cluster node IS a container (kindest/node image), so the node's own
      # processes (CNI installers copying binaries, mount, kubelet helpers) match upstream container rules such as
      # "Drop and execute new binary in container" at CRITICAL - an escalation storm on every new node. Only the node
      # image itself is excepted; containers started inside the node keep their own image and stay covered.
      - macro: platform_capd_node_container
        condition: (container.image.repository endswith "kindest/node")
      - rule: Drop and execute new binary in container
        condition: and not platform_capd_node_container
        override:
          condition: append

      # In-cluster builds (addon openchoreo-workflow-plane, Argo Workflows in OpenChoreo's workflows-<org> namespaces)
      # execute binaries they wrote themselves, which this rule reports at CRITICAL (= an escalation per build step):
      # rootless buildkitd extracts and runs its binfmt/qemu probe ($HOME/.local/tmp/qemu-check<n>/check) on start, and
      # `go test` runs the test binary it just compiled (/tmp/go-build<n>/b<n>/<pkg>.test). Measured on mgmt: these two
      # were every Critical alert from workflows-* pods. Each exception is the full tuple (namespace prefix, image, parent
      # process, binary path); any other dropped binary in the same pods, and the same binary anywhere else, still fires.
      - rule: Drop and execute new binary in container
        exceptions:
          - name: platform_build_dropped_binaries
            fields: [k8s.ns.name, container.image.repository, proc.pname, proc.exepath]
            comps: [startswith, =, =, glob]
            values:
              - [workflows-, docker.io/moby/buildkit, buildkitd, /home/user/.local/tmp/qemu-check*/check]
              - [workflows-, docker.io/library/golang, go, /tmp/go-build*/b*/*.test]
        override:
          exceptions: append

      - rule: Platform shell in app container
        desc: An interactive or scripted shell started inside a container of an OpenChoreo app namespace.
        condition: >
          spawned_process and container and platform_app_namespace
          and proc.name in (ash, bash, csh, ksh, sh, tcsh, zsh, dash)
        output: >
          Shell in app container (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name shell=%proc.name
          parent=%proc.pname cmdline=%proc.cmdline user=%user.name image=%container.image.repository)
        priority: WARNING
        tags: [platform, container, shell, mitre_execution, T1059]

      - rule: Platform write below etc
        desc: A file below /etc opened for writing in a container outside the platform namespaces.
        condition: >
          open_write and container and fd.name startswith /etc/
          and not k8s.ns.name in (platform_namespaces)
          and not proc.name in (update-ca-certi, ca-certificates, nginx-entrypoi)
        output: >
          Write below /etc in container (file=%fd.name ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
          proc=%proc.name cmdline=%proc.cmdline image=%container.image.repository)
        priority: ERROR
        tags: [platform, container, filesystem, mitre_persistence, T1543]

      - list: platform_miner_binaries
        items: [xmrig, xmr-stak, minerd, cpuminer, ccminer, cgminer, bfgminer, ethminer, nbminer, t-rex, lolminer,
                nanominer, phoenixminer, teamredminer, gminer, srbminer]
      - list: platform_miner_ports
        items: [3333, 4444, 5555, 6666, 7777, 8888, 9999, 14433, 14444, 45560, 45700]
      - rule: Platform crypto miner indicators
        desc: Known miner binary, stratum URL on the command line, or connection to a mining-pool port, in an app namespace.
        condition: >
          container and platform_app_namespace and (
            (spawned_process and (proc.name in (platform_miner_binaries)
              or proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum+ssl"
              or proc.cmdline contains "stratum2+tcp"))
            or (outbound and fd.sport in (platform_miner_ports))
          )
        output: >
          Crypto miner indicator (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name proc=%proc.name
          cmdline=%proc.cmdline connection=%fd.name image=%container.image.repository)
        priority: CRITICAL
        tags: [platform, container, cryptomining, mitre_impact, T1496]

  falcosidekick:
    image:
      tag: 2.35.1@sha256:a9bb60d2c7742febd912315ca1155839abc0199bf322c58d3adbb8b0849fadb9   # index: amd64, arm64, arm
    enabled: true
    fullnameOverride: falco-falcosidekick
    replicaCount: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
    webui:
      enabled: false
    config:
      # Every event names its cluster (output_fields.cluster): set per cluster by the addon ApplicationSet (catalog
      # clusterNameFormats "cluster:%s"); falco-response cross-checks it against the endpoint the event arrived on.
      # -- Tags events with `cluster:<name>` (`clusterNameFormats`), forwards to `telemetry-collector` and `falco-talon`, and escalates `critical` events via `falcosidekick-escalation`.
      customfields: ""
      webhook:
        minimumpriority: critical      # escalation (address + token: Secret falcosidekick-escalation, extraEnv below)
      # Talon: every event; Talon itself only acts on the platform rule names (rulesOverride below).
      talon:
        address: http://falco-talon:2803
        minimumpriority: warning
      # Telemetry collector of addon telemetry (workload clusters; values/role-mgmt.yaml blanks these on mgmt).
      cloudevents:
        address: http://telemetry-collector.telemetry.svc.cluster.local:8088/falco
        minimumpriority: notice
      otlp:
        metrics:
          endpoint: http://telemetry-collector.telemetry.svc.cluster.local:4317
          protocol: grpc
          checkcert: false
          minimumpriority: notice
      # webhook: Secret falcosidekick-escalation; slack: Secret falcosidekick-outputs (templates/outputs-secret.yaml)
      extraEnv:
        - name: WEBHOOK_ADDRESS
          valueFrom: { secretKeyRef: { name: falcosidekick-escalation, key: WEBHOOK_ADDRESS, optional: true } }
        - name: WEBHOOK_CUSTOMHEADERS
          valueFrom: { secretKeyRef: { name: falcosidekick-escalation, key: WEBHOOK_CUSTOMHEADERS, optional: true } }
        - name: SLACK_WEBHOOKURL
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: SLACK_WEBHOOKURL, optional: true } }
        - name: SLACK_MINIMUMPRIORITY
          valueFrom: { secretKeyRef: { name: falcosidekick-outputs, key: SLACK_MINIMUMPRIORITY, optional: true } }

  responseActions:
    enabled: false               # the falco chart's bundled Talon is 0.4.x; this addon pins falco-talon 0.5.0 directly

# --- Falco Talon: scoped responses (rules match only the platform rules, which fire only in dp-* namespaces) ---------
falco-talon:
  # -- Enables Falco Talon (`config.rulesOverride` labels suspicious pods on app container shells and terminates pods matching crypto-miner rules).
  enabled: true
  replicaCount: 1                # upstream 2 (+ leader election); one is enough per cluster here
  image:
    # Fully qualified on Docker Hub itself (chart default: the falco.docker.scarf.sh download-tracking proxy). Tag only:
    # chart 0.5.0 copies image.tag into the app.kubernetes.io/version label (a tag@digest is not a valid label value)
    # and has no digest field - listed exception in hack/tests/test_image_pins.sh until the chart supports digests.
    registry: docker.io
    tag: 0.3.0                   # = chart appVersion; index digest sha256:333224a111a0722ff3f418ffe6bc5d8a3be0941f37c67520bc845e62f1234ad3
    pullPolicy: IfNotPresent     # upstream Always
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  rbac:                          # platform: least privilege for label / terminate / (commented) isolate
    namespaces: []
    pods: [get, list, update, patch, delete]
    podsEphemeralcontainers: []
    nodes: []
    podsLog: []
    podsExec: []
    podsEviction: [get, create]
    events: [get, create, update, patch]
    daemonsets: []
    deployments: []
    replicasets: [get]
    statefulsets: [get]
    networkpolicies: [get, create, update, patch]
    caliconetworkpolicies: []
    ciliumnetworkpolicies: []
    roles: []
    clusterroles: []
    configmaps: []
    secrets: []
    leases: [get, create, update, patch, watch]
  config:
    defaultNotifiers: [k8sevents]
    # Appended to the chart's rules.yaml. Talon 0.3 rule field `dry_run` ("true"/"false"). Per-environment dry run:
    # override this whole value with `dry_run: true` on the rules (installations/<inst>/addons/falco/env-<env>.yaml;
    # example: installations/local/addons/falco/).
    rulesOverride: |
      - action: Platform label suspicious
        actionner: kubernetes:label
        parameters:
          labels:
            platform.koorikla.io/falco: suspicious

      - action: Platform terminate pod
        actionner: kubernetes:terminate
        parameters:
          ignore_daemonsets: true
          ignore_statefulsets: false
          grace_period_seconds: 0

      # - action: Platform isolate pod      # Egress-only NetworkPolicy on the pod's owner: no egress at all (DNS too)
      #   actionner: kubernetes:networkpolicy
      #   parameters:                     # Talon 0.3: allow_cidr (CIDRs), allow_namespaces (names); both empty = deny
      #     allow_cidr: []

      - rule: Crypto miner in app namespace
        description: Label and kill the pod (its controller recreates it; repeated hits stay visible in OpenSearch).
        match:
          rules:
            - Platform crypto miner indicators
        dry_run: false
        actions:
          - action: Platform label suspicious
          - action: Platform terminate pod

      - rule: Shell in app container
        description: Label only (an operator may be debugging); isolate by uncommenting the action below.
        match:
          rules:
            - Platform shell in app container
        dry_run: false
        actions:
          - action: Platform label suspicious
          # - action: Platform isolate pod
