{{- /* OpenChoreo authz for promotions (docs/promotion.md "Manual approval"): restricted groups may not write bindings in
gated environments through console/API/occ/MCP; plus the promotion gate's read-only client identity. */ -}}
{{- $ns := .Values.openchoreo.orgNamespace }}
{{- $gated := .Values.promotion.gatedEnvironments | default list }}
{{- if $gated }}
{{- $bindingWrites := list "releasebinding:create" "releasebinding:update" "releasebinding:delete"
      "projectreleasebinding:create" "projectreleasebinding:update" "projectreleasebinding:delete"
      "resourcereleasebinding:create" "resourcereleasebinding:update" "resourcereleasebinding:delete" }}
{{- $envIds := list }}
{{- range $gated }}{{ $envIds = append $envIds (printf "%s/%s" $ns .) }}{{ end }}
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: promotion-release-binding-writer
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Change ReleaseBindings, ProjectReleaseBindings and ResourceReleaseBindings (used with environment conditions to gate promotions)
  actions:
    {{- range $bindingWrites }}
    - {{ . }}
    {{- end }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: promotion-component-deleter
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Delete Components (denied per gated Component by charts/tenant; offboarding goes through git)
  actions:
    - component:delete
{{- range $group := .Values.promotion.restrictedGroups }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: promotion-deny-{{ $group | lower | replace "_" "-" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openchoreo.dev/description: {{ printf "%s may not change bindings in %s: promotion there is a reviewed pull request" $group (join ", " $gated) | quote }}
spec:
  effect: deny
  entitlement:
    claim: groups
    value: {{ $group | quote }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: promotion-release-binding-writer
      scope:
        namespace: {{ $ns }}
      conditions:
        - actions:
            {{- range $bindingWrites }}
            - {{ . }}
            {{- end }}
          expression: {{ printf "resource.environment in %s" ($envIds | toJson) | quote }}
{{- end }}
{{- end }}
{{- if .Values.promotionGate.enabled }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: promotion-gate
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: Promotion gate workflow - read releases, bindings, pipeline and observability data
  actions:
    - namespace:view
    - project:view
    - component:view
    - workload:view
    - environment:view
    - deploymentpipeline:view
    - componentrelease:view
    - releasebinding:view
    - alerts:view
    - logs:view
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: promotion-gate-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  effect: allow
  entitlement:
    claim: client_id
    value: {{ .Values.promotionGate.clientID | quote }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: promotion-gate
      scope:
        namespace: {{ $ns }}
{{- end }}
