{{- /* ValidatingAdmissionPolicy: (Resource)ReleaseBindings of gated environments are written only by their gated Argo CD
Application, whatever the caller's RBAC. Rules and reasons: docs/promotion.md "Git is the only path". */ -}}
{{- $g := .Values.promotion }}
{{- if and $g.gatedEnvironments $g.gitOnly.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openchoreo-gated-bindings-from-git
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [openchoreo.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [releasebindings, resourcereleasebindings]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.openchoreo.orgNamespace }}
  matchConditions:
    - name: gated-environment
      expression: >-
        (request.operation == 'DELETE' ? oldObject.spec.environment : object.spec.environment)
        in {{ $g.gatedEnvironments | toJson }}
  variables:
    - name: user
      expression: request.userInfo.username
    - name: binding
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: trackingApp
      expression: >-
        has(variables.binding.metadata.annotations)
        && 'argocd.argoproj.io/tracking-id' in variables.binding.metadata.annotations
        ? variables.binding.metadata.annotations['argocd.argoproj.io/tracking-id'].split(':')[0] : ''
    - name: componentApp            # the gated Application of this binding's component (charts/tenant)
      expression: >-
        has(variables.binding.spec.owner) && has(variables.binding.spec.owner.projectName)
        && has(variables.binding.spec.owner.componentName)
        ? variables.binding.spec.owner.projectName + '-' + variables.binding.spec.owner.componentName + '-'
        + variables.binding.spec.environment : ''
    - name: projectGatedApp         # ResourceReleaseBindings: any gated Application <project>-<app>-<env> of the project
      expression: >-
        has(variables.binding.spec.owner) && has(variables.binding.spec.owner.projectName)
        && variables.trackingApp.startsWith(variables.binding.spec.owner.projectName + '-')
        && variables.trackingApp.endsWith('-' + variables.binding.spec.environment)
        && size(variables.trackingApp) > size(variables.binding.spec.owner.projectName) + size(variables.binding.spec.environment) + 2
    - name: gatedApp
      expression: >-
        variables.binding.kind == 'ResourceReleaseBinding' ? variables.projectGatedApp
        : variables.componentApp != '' && variables.trackingApp == variables.componentApp
    - name: breakGlass
      expression: 'request.userInfo.groups.exists(g, g in {{ $g.gitOnly.breakGlassGroups | default list | toJson }})'
  validations:
    - expression: >-
        (variables.user in {{ $g.gitOnly.writers | toJson }} && variables.gatedApp)
        || variables.breakGlass
        || (request.operation == 'DELETE' && variables.user in {{ $g.gitOnly.deleters | toJson }})
        || (request.operation == 'UPDATE' && variables.user in {{ $g.gitOnly.metadataWriters | toJson }}
            && object.spec == oldObject.spec)
      messageExpression: >-
        variables.user in {{ $g.gitOnly.writers | toJson }}
        ? (variables.binding.kind == 'ResourceReleaseBinding'
        ? 'ResourceReleaseBindings of ' + {{ join ", " $g.gatedEnvironments | squote }} + ' sync only through a gated
        Argo CD Application <project>-<app>-<environment> of their project (docs/promotion.md), denied for Application '
        : 'ReleaseBindings of ' + {{ join ", " $g.gatedEnvironments | squote }} + ' sync only through the gated Argo CD
        Application <project>-<component>-<environment> of their component (docs/promotion.md); want ' +
        (variables.componentApp == '' ? '(owner incomplete)' : variables.componentApp) + ', denied for Application ')
        + (variables.trackingApp == '' ? '(no tracking-id)' : variables.trackingApp)
        : 'ReleaseBindings of ' + {{ join ", " $g.gatedEnvironments | squote }} + ' change only through a reviewed pull
        request synced by Argo CD (docs/promotion.md); denied for ' + variables.user
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openchoreo-gated-bindings-from-git
spec:
  policyName: openchoreo-gated-bindings-from-git
  validationActions: [Deny]
{{- end }}
