{{- /* Build GitHub App credentials in workflows-<org ns> (docs/build-plane.md "Git credentials"): the App secret, read only
by ESO, and a Role letting OpenChoreo's workflow-plane agent apply each run's GithubAccessToken generator. */ -}}
{{- if and .Values.openchoreo.workflowPlane.enabled .Values.buildWorkflows.enabled }}
{{- $g := .Values.buildWorkflows.github }}
{{- $ns := printf "workflows-%s" .Values.openchoreo.orgNamespace }}
{{ include "platform.githubAppSecret" (dict "name" $g.appSecret "namespace" $ns "store" $g.secretStore "key" $g.key) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-github-tokens
  namespace: {{ $ns }}
rules:
  - apiGroups: [generators.external-secrets.io]
    resources: [githubaccesstokens]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-github-tokens
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-github-tokens
subjects:
  - kind: ServiceAccount
    name: {{ $g.agent.serviceAccount }}
    namespace: {{ $g.agent.namespace }}
{{- end }}
