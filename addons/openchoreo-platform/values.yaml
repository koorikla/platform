# OpenChoreo platform-team resources on mgmt (README.md). CRs carry SkipDryRunOnMissingResource: Argo CD retries until
# addon openchoreo-control-plane has installed the CRDs. Environments live in charts/cluster, Projects in charts/tenant.

# --- installation.yaml (defaults so `helm template` works standalone) ---------------------------------------------
installation:
  githubOrg: https://github.com/koorikla      # the promotion gate opens PRs only in repositories of this owner
openchoreo:
  orgNamespace: default
  controlPlane:
    host: openchoreo.localhost
  observability:
    enabled: true
    httpPort: 11080
  workflowPlane:
    enabled: true
    autoBuild: poll                           # poll | webhook | none (templates/auto-build.yaml)

# DeploymentPipeline `default`: promotion order. Every Project created from a tenant file references it (charts/tenant),
# and charts/tenant renders one ProjectReleaseBinding per environment listed here (keep both lists in sync).
deploymentPipeline:
  name: default
  # -- `[development, staging, production]`.
  environments: [development, staging, production]

# Upstream defaults from files/ (see files/README.md); set false to manage them elsewhere.
upstreamDefaults:
  enabled: true

# Data-service types in files/platform/ (docs/data-services.md): ClusterTrait keda-scaler and the ClusterResourceTypes
# of the Crossplane platform APIs (postgresql, mysql, ...).
dataServices:
  # -- Platform types for the data-service addons (`files/platform/`); usable only where the data plane announces the addon (`platform.koorikla.io/requires-addons`).
  enabled: true

# docs/openchoreo.md "Resilience defaults". Needs the PriorityClasses app-production/app-standard on the data planes
# (addon priority-classes).
resilience:
  # -- Embed ClusterTrait `resilience` (topology spread, PodDisruptionBudget, preStop + grace period, PriorityClass) in the Deployment component types.
  enabled: true

# docs/openchoreo.md "Application metrics": opt-in PodMonitor for the component's metrics port (addon telemetry scrapes it).
appMetrics:
  # -- Render ClusterTrait `metrics` and add it to the `allowedTraits` of the Deployment component types.
  enabled: true

# installation.yaml secrets: tenantStores.enabled points component ExternalSecrets at the cell's SecretStore
# tenantStoreName (== addon secret-stores tenantStores.storeName); auto-build needs githubGateApp.enabled (its token).
secrets:
  tenantStores:
    enabled: false
  githubGateApp:
    enabled: false
tenantStoreName: openbao-tenant

# --- Promotion gates (docs/promotion.md) ------------------------------------------------------------------------------
# installation.yaml `promotion` is shared with charts/tenant (Argo CD sync windows, per-environment Applications) and
# overrides these defaults.
promotion:
  # Environments whose ReleaseBinding changes only through a reviewed pull request: their binding file syncs through
  # its own Argo CD Application (charts/tenant) and in OpenChoreo only `approverGroups` may write their bindings.
  # -- Restricts `production` binding writes to Argo CD (`promotion.{gatedEnvironments,restrictedGroups,gitOnly,freezeWindows}`) and enforces sync freeze windows.
  gatedEnvironments: [production]
  # Groups (JWT claim `groups`) denied releasebinding, projectreleasebinding and resourcereleasebinding
  # create/update/delete in gated environments through console, openchoreo-api, occ and MCP (an explicit deny wins over
  # the upstream developer role's allow). Argo CD applies git through the Kubernetes API and is not affected.
  restrictedGroups: [developers]
  # Native ValidatingAdmissionPolicy: bindings of gated environments are written only by Argo CD (git), whoever asks
  # (openchoreo-api on behalf of console/occ/MCP users, kubectl). templates/promotion-git-only.yaml.
  gitOnly:
    enabled: true
    writers: [system:serviceaccount:argocd:argocd-application-controller]
    metadataWriters: [system:serviceaccount:openchoreo-control-plane:controller-manager]   # finalizers only
    deleters: [system:serviceaccount:kube-system:generic-garbage-collector, system:serviceaccount:kube-system:namespace-controller]
    breakGlassGroups: []             # e.g. [platform-break-glass]; empty = git only, no exceptions
  # Weekly freeze windows (gate workflow refuses, Argo CD sync window denies syncs of the gated Applications).
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]

# ClusterWorkflow `promotion-gate`: a generic OpenChoreo Workflow (WorkflowRun, no component) that verifies a release
# in its source environment and opens the promotion pull request (files/promotion-gate/gate.py). Started by the
# Sensor in addon argo-events after a successful rollout in one of its promotionGate.sourceEnvironments, or by hand
# (occ / console Workflows / MCP / kubectl create of a WorkflowRun). Runs in the workflow plane (namespace
# workflows-<org namespace>, ServiceAccount workflow-sa) and needs a ClusterWorkflowPlane `default`.
promotionGate:
  # -- HTTP `smoke` + 15-minute Prometheus 5xx SLO gate (`observe`) posting `statusContext` (`openchoreo/promotion-gate`) on PRs.
  enabled: true
  workflowPlane: default             # ClusterWorkflowPlane (addon openchoreo-workflow-plane)
  # Pod labels of the gate pod: opt-in to the run namespace's NetworkPolicy platform-workflows-openchoreo (egress to the
  # control-plane Gateway (API, Thunder) and the observer). == openchoreo-workflow-plane runNetworkPolicy.platformWorkflows.podLabels
  podLabels: { platform.koorikla.io/egress: openchoreo }
  image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 128Mi }
  # The WorkflowRun and its per-run resources (the credentials Secret) are deleted this long after completion.
  ttlAfterCompletion: 1h
  # Endpoints (empty = derived from installation openchoreo.controlPlane.host / openchoreo.observability.httpPort).
  # Derived = plain HTTP (local docker network only): every other installation sets https:// URLs here, the gate
  # sends the Thunder client secret to tokenURL.
  apiURL: ""                         # http://api.<host>:8080
  tokenURL: ""                       # http://thunder.<host>:8080/oauth2/token
  observerURL: ""                    # http://observer.<host>:<httpPort>
  # Observability-plane Prometheus (in-cluster on mgmt; NetworkPolicies: openchoreo-workflow-plane
  # runNetworkPolicy.platformWorkflows egress, openchoreo-observability-plane prometheusIngress). The gate's 5xx rate
  # reads the data-plane kgateway Envoy series there (addon telemetry gatewayMetrics; docs/promotion.md).
  prometheusURL: http://openchoreo-observability-prometheus.openchoreo-observability-plane:9091
  controlPlanePort: 8080             # control-plane Gateway HTTP listener (addon openchoreo-control-plane)
  # Thunder client (client_credentials) the gate authenticates as (addon thunder bootstrap script 70, same store key);
  # role binding in templates/promotion-authz.yaml. Secret from the workflow plane's secret store, key `promotion-gate`,
  # property `client-secret`.
  clientID: openchoreo-promotion-gate
  clientSecret: { key: promotion-gate, property: client-secret }
  # The gate's own GitHub App (store key with githubAppID, githubAppInstallationID, githubAppPrivateKey; permissions
  # and setup: docs/promotion.md, docs/forking.md). Each run mints a token for the component's one repository.
  github: { key: promotion-gate-github }
  statusContext: openchoreo/promotion-gate   # required status check on the app repo's default branch
  baseBranch: main
  bindingPath: deploy/openchoreo/release-bindings/{environment}.yaml   # app repo contract (docs/openchoreo.md)
  smoke:
    http: true                       # GET every external endpoint of the source binding; only 2xx passes
    path: /
    # How the probe reaches an endpoint. dns: connect to the externalURL host (cloud: public DNS / load balancer).
    # podHostIP: connect to the hostIP of a running Pod of the source binding (OpenChoreo API k8sresources tree) on the
    # externalURL port (= ClusterDataPlane gateway port) and send the URL host as Host header. For data planes whose
    # Gateway listens on every node (k3s klipper hostPort, CAPD) and whose hosts do not resolve from mgmt (local).
    connect: dns
    # Extra gate egress for connect podHostIP: TCP ports to any address (NetworkPolicy promotion-gate-smoke in
    # workflows-<org ns>; CAPD node IPs come from a per-host docker network). == charts/cluster openchoreo.dataPlane.gatewayPort
    egressPorts: []
  observe:
    enabled: true
    windowMinutes: 15
    maxErrorRate: 0.05               # 5xx share of the gateway's requests to the component in the source environment
# --- in-cluster builds (docs/build-plane.md) ---------------------------------------------------------------------
# Image registry: installation.yaml `registry` (defaults for standalone renders). harbor: push to
# <host>/<appsProject>/<project>/<component> as robot `builder`; external: push to <external.repository>/<component>.
registry:
  type: harbor
  host: harbor.openchoreo.localhost:9443
  appsProject: apps
  external:
    repository: ghcr.io/koorikla
    credentialsKey: platform-ghcr

# ClusterWorkflows (OpenChoreo, on the control plane) -> Argo ClusterWorkflowTemplate koorikla-build on the workflow plane
# (addon openchoreo-workflow-plane). One component workflow per stack, same ci/scripts as the GitHub Actions
# wrappers; the stack's ClusterComponentTypes list them in allowedWorkflows (templates/upstream-defaults.yaml).
buildWorkflows:
  # -- Language stack build workflows (`buildWorkflows.{stacks,platforms,secrets}`: `go`, `nextjs`, `elixir`, `ruby`, `dockerfile`) and chart deploy workflow (`helmChartWorkflow`).
  enabled: true
  workflowPlane: default                     # ClusterWorkflowPlane
  workflowTemplate: koorikla-build
  ttlAfterCompletion: 1d
  platforms: linux/amd64,linux/arm64         # default per run; a run may narrow it (e.g. the node's arch only)
  # Signing with the platform key (cosign-platform). transparencyLog false (default): no entry in the public Rekor log
  # (it would publish private repo names and digests); verify with `cosign verify --key cosign.pub
  # --insecure-ignore-tlog=true`. true: also upload to public Rekor (needs egress to Sigstore). Per installation in
  # installations/<inst>/addons/openchoreo-platform/values.yaml. docs/build-plane.md "Signing".
  signing:
    transparencyLog: false
  # Repositories builds may clone and push to: https URL prefixes ending in "/" (one owner each). Empty = the
  # installation's githubOrg. Enforced three times: the ClusterWorkflow schema pattern on repository.url, the checkout
  # and gitops scripts (BUILD_GUARDS in koorikla-build), and git's credential helper, registered only for these
  # prefixes, so the run's token is never sent to any other host or owner.
  git:
    allowedRepositoryPrefixes: []
  # Per-run installation tokens of a GitHub App for the run's one repository (docs/build-plane.md "Git credentials").
  # `key` must be in addon secret-stores workflowStore.keys; previews and helm-chart runs get `readPermissions`.
  github:
    # -- Per-run GitHub App installation tokens (`buildWorkflows.github`) for the run's one repository (ESO `GithubAccessToken` generator; `contents: write` for builds, `read` for charts), no PAT.
    key: promotion-gate-github
    appSecret: build-github-app
    secretStore: workflows                   # == addon openchoreo-workflow-plane clusterWorkflowPlane.secretStore
    apiURL: ""                               # GitHub Enterprise Server: https://<host>/api/v3 ("" = api.github.com)
    permissions: { contents: write }
    readPermissions: { contents: read }
    tokenRefreshInterval: 30m
    # OpenChoreo's workflow-plane agent applies the per-run resources: it gets create/update/delete on
    # GithubAccessToken generators in workflows-<org ns> only (upstream ClusterRole cluster-agent-workflowplane has no
    # generators.external-secrets.io).
    agent: { namespace: openchoreo-workflow-plane, serviceAccount: cluster-agent-workflowplane }
  # Per-run Secrets (ExternalSecrets in workflows-<org ns>, store = the ClusterWorkflowPlane's secretStoreRef):
  secrets:
    cosign: cosign-platform                  # cosign.key (encrypted), cosign.password; cosign.pub is public
    harbor:                                  # registry.type harbor
      robot: robot$builder                   # == addons/harbor config.robots[name=builder]
      key: harbor
      property: builder-secret
      caStore: mgmt-harbor                   # name-scoped read of the registry CA public cert (addon harbor)
      caSecret: harbor-ca-bundle
  stacks:
    - name: go
      displayName: Go
      description: Go module - go vet, golangci-lint (if present), go test -race, govulncheck, multi-arch image
      stack: go
      checkImage: docker.io/library/golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
      checkSetup: ""
      checkEnv: { RUN_LINT: "true", RUN_VULNCHECK: "true" }
    - name: nextjs
      displayName: Next.js
      description: Next.js app - install, lint, typecheck, test, next build, dependency audit, multi-arch image
      stack: nextjs
      checkImage: docker.io/library/node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0
      checkSetup: ""
      checkEnv: { RUN_LINT: "true", RUN_TYPECHECK: "true", RUN_TEST: "true", RUN_BUILD: "true", RUN_AUDIT: "true", AUDIT_LEVEL: critical }
    - name: elixir
      displayName: Elixir / Phoenix
      description: mix project - compile --warnings-as-errors, format, credo, test (+ PostgreSQL), sobelow, audits, image
      stack: elixir
      checkImage: docker.io/library/elixir:1.19.7-otp-28@sha256:7e27df3e4a684163e4a18e618eede53badb70e97e0c92a1845ab22e2e1d96da2
      checkSetup: mix local.hex --force && mix local.rebar --force
      checkEnv: { MIX_ENV: test, RUN_FORMAT: "true", RUN_CREDO: "true", RUN_TEST: "true", RUN_SOBELOW: "true", RUN_AUDIT: "true" }
      postgres: true                         # offers parameter checks.postgres (ephemeral sidecar, default off)
    - name: ruby
      displayName: Ruby / Rails
      description: Bundler app - rubocop, rspec / rails test (+ PostgreSQL), brakeman, bundler-audit, image
      stack: ruby
      checkImage: docker.io/library/ruby:3.4.12-trixie@sha256:5803b69dd8a875a9afc7e3bbc10d0ba683e12aad2640dbbd44295b4890cc8927
      checkSetup: bundle install --jobs 4
      checkEnv: { RUN_RUBOCOP: "true", TEST_COMMAND: auto, RUN_BRAKEMAN: auto, RUN_AUDIT: "true" }
      postgres: true
    - name: dockerfile
      displayName: Dockerfile
      description: Any Dockerfile - dependency scan, multi-arch image, scan, SBOM, signature (no language checks)
      stack: none
      checkImage: ""
      checkSetup: ""
      checkEnv: {}

# Auto-build (docs/build-plane.md "Auto-build"): WorkflowRun <component>-<sha[:12]> once per new commit of every
# Component with spec.autoBuild: true. Trigger = installation.yaml openchoreo.workflowPlane.autoBuild:
#   poll     CronWorkflow on pollSchedule (no inbound traffic)
#   webhook  GitHub push -> addon argo-events; the CronWorkflow still runs on resyncSchedule as a safety net
#   none     builds only from Backstage / occ / kubectl
autoBuild:
  workflowTemplate: auto-build               # == addon argo-events autoBuild.workflowTemplate (Sensor target)
  # -- Builds Components with `autoBuild: true` once per new commit (`autoBuild.{pollSchedule,resyncSchedule,github}`); trigger per installation `openchoreo.workflowPlane.autoBuild` (`poll` | `webhook` | `none`).
  pollSchedule: "* * * * *"                  # trigger poll (cron, UTC); GitHub cost: one conditional request per
                                             # repo/branch, 304s are free; a pass that overlaps the next is skipped
  resyncSchedule: "*/30 * * * *"             # trigger webhook: reconcile missed deliveries ("" = off)
  maxRunsPerPass: 5                          # WorkflowRuns one pass may create (the rest wait for the next pass)
  staleRunSeconds: 7200                      # an unfinished auto-build run older than this no longer blocks the next
  minRateRemaining: 100                      # pause the pass when the token's GitHub rate limit falls below this
  stateConfigMap: auto-build-state           # cache only (ETags, last handled head); losing it never rebuilds
  secretStore: workflows                     # == addon openchoreo-workflow-plane clusterWorkflowPlane.secretStore
  # Installation token of this GitHub App (store key in addon secret-stores workflowStore.keys), limited to
  # `permissions` and re-minted every tokenRefreshInterval; the pass mounts only that token.
  github:
    key: promotion-gate-github
    permissions: { contents: read }
    tokenRefreshInterval: 30m
  # registry.type harbor: a Workload digest missing in Harbor (e.g. after a clean bootstrap) is rebuilt. Pull-only robot
  # == addons/harbor config.robots[name=nodes]; CA from buildWorkflows.secrets.harbor.caStore/caSecret.
  registry:
    robot: robot$nodes
    key: harbor
    property: nodes-secret
  image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
  # PR previews (installation.yaml previews.enabled, docs/preview-environments.md): the same pass builds PR heads of
  # opted-in Components, cuts their ComponentRelease, posts the URL and expires them. A second token of the same App
  # for that (commit statuses, PR lookup, the expiry label); the App needs Commit statuses + Pull requests write.
  previews:
    github:
      permissions: { statuses: write, pull_requests: write }
    # -- With `installation.yaml` `previews.enabled`, builds PR heads, cuts the preview `ComponentRelease`, posts `openchoreo/preview` and expires previews ([preview environments](../../docs/preview-environments.md)).
    statusContext: openchoreo/preview          # commit status on the PR head (Details = the preview URL)
    optIn:                                     # == charts/tenant previewOptIn (the ApplicationSet's selector)
      annotation: platform.koorikla.io/preview-environments
      value: enabled
    argocdNamespace: argocd
    schedule: "*/2 * * * *"                    # trigger webhook only (poll runs previews every pollSchedule)

# installation.yaml (valuesObject): previews.enabled / ttl / expiredLabel.
previews:
  enabled: false

# Generic (non-component) workflow: package + push + sign a Helm chart as OCI (<registry>/charts/<name>).
helmChartWorkflow:
  enabled: true
  name: helm-chart
  workflowTemplate: koorikla-helm-chart
