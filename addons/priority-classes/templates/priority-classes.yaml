{{- /* PriorityClasses for OpenChoreo components (docs/openchoreo.md "Resilience defaults"). value and preemptionPolicy
are immutable: Force=true,Replace=true recreates a changed class, client-side diff only (#281, test_immutable_fields.sh). */ -}}
{{- range $name, $pc := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
value: {{ $pc.value }}
preemptionPolicy: {{ $pc.preemptionPolicy }}
globalDefault: false
description: {{ $pc.description | quote }}
{{- end }}
