# Kyverno 1.20 (chart 3.10.0) on every cluster (catalog: namespace kyverno, roles [mgmt, workload], default true).
# Policies come separately (addons/kyverno-policies) so the engine and its CRDs exist before any policy is applied;
# the policies app just retries until then. docs/networking.md "Kyverno".
#
# Bootstrap safety: Kyverno's webhooks never see the platform namespaces (list below), so a Kyverno outage can only
# affect tenant namespaces, never Argo CD, CAPI, ESO, OpenChoreo, the CNI or the mesh. The same list is excluded in
# addons/kyverno-policies (vpolExclude) - keep both in sync (hack/tests/test_gitops_contracts.sh checks it).
# Argo CD applies this app with ServerSideApply (all generated apps): Kyverno's CRDs exceed the client-side
# last-applied annotation limit. Chart hooks: pre/post-install/upgrade jobs run as Argo PreSync/PostSync hooks on every
# sync; the chart's `helm test` pods have no toggle; Argo CD ignores them.

# provider byo (values/provider-byo.yaml): ConfigMap platform-image-verification rebuilt from the Secret mgmt pushes into
# platform-delivery, instead of the ClusterResourceSet (templates/byo-image-verification.yaml).
byoDelivery:
  # -- On byo clusters (`values/provider-byo.yaml`), `templates/byo-image-verification.yaml` rebuilds ConfigMap `platform-image-verification` from the Secret mgmt pushes ([byo](../../docs/providers.md#bring-your-own-cluster-byo)).
  enabled: false
  store: delivery                           # ClusterSecretStore of addon secret-stores (delivery.*)
  configMap: platform-image-verification    # == charts/cluster imageVerification.configMap

kyverno:
  # Images: chart default registries (reg.kyverno.io, ghcr.io), tag@digest pinned by multi-arch index digest
  # (docs/conventions.md invariant 9; hack/tests/test_image_pins.sh). Every image of the chart, hooks and the helm test
  # pod included; a chart bump updates all of them together.
  upgrade:
    legacyPolicyCheck:
      image: { tag: "v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4" }   # kyverno-cli
  crds:
    migration:
      image: { tag: "v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4" }   # kyverno-cli
  test:
    image: { tag: "v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c" }   # readiness-checker
  webhooksCleanup:
    image: { tag: "v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c" }   # readiness-checker
  config:
    # Webhook namespaceSelector. For Namespace objects it matches the Namespace's own labels, so platform namespaces
    # can't be mutated either; OpenChoreo cell namespaces (dp-*) are not listed and stay in scope.
    webhooks:
      # -- Excludes `platformNamespaces` (`kube-system`, `argocd`, `capi-*`, `openchoreo-*`, etc.) from admission webhook interception.
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: &platformNamespaces
              - kube-system
              - kube-public
              - kube-node-lease
              - kyverno
              - argocd
              - cert-manager
              - external-secrets
              - platform-secrets
              - capi-operator-system
              - capi-system
              - capi-k3s-bootstrap-system
              - capi-k3s-control-plane-system
              - capd-system
              - capa-system
              - caph-system
              - fleet
              - openchoreo-control-plane
              - openchoreo-data-plane
              - openchoreo-workflow-plane
              - openchoreo-observability-plane
              - openchoreo-secrets
              - thunder
              - kgateway-system
              - istio-system
              - cilium
              - falco
              - telemetry
              - obi
              - agentgateway-system   # not external-dns: it meets Pod Security restricted, so it gets admission + policies
    # ...and the engine skips them too (background scans, reports).
    resourceFiltersIncludeNamespaces: *platformNamespaces

  # One replica per controller (local footprint); HA installations override admissionController.replicas: 3 and
  # the others: 2 in installations/<inst>/addons/kyverno/values.yaml.
  admissionController:
    replicas: 1
    initContainer:
      image: { tag: "v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b" }   # kyvernopre
    container:
      # -- `v1.20.0` pinned by multi-arch index digest (alongside `backgroundController`, `cleanupController`, `reportsController`; `values/role-workload.yaml` mounts `platform-image-verification` and `SSL_CERT_DIR` to trust the Harbor CA, [supply-chain](../../docs/supply-chain.md#wiring-the-key)).
      image: { tag: "v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d" }
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 384Mi }
      # Image verification cache: a keyless verification costs ~5 s, a cached one ~0. TTL 24h keeps staging-verified
      # digests cached for that day's production promotion; 32 MiB holds ~30 images (docs/supply-chain.md "Admission latency").
      extraArgs:
        imageVerifyCacheEnabled: true
        imageVerifyCacheTTLDuration: 24h
        imageVerifyCacheMaxSize: "33554432"   # bytes, quoted: helm renders a bare number as 3.3554432e+07
        # Lease = 6x, renew deadline = 5x this period (upstream 2s): rides out bootstrap etcd stalls that restarted every
        # controller (docs/dev-environment.md "Leader election on slow disks"). Same value on every controller.
        leaderElectionRetryPeriod: &kyvernoLeaderElectionRetryPeriod 10s
  backgroundController:
    replicas: 1
    image: { tag: "v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7" }
    extraArgs:
      leaderElectionRetryPeriod: *kyvernoLeaderElectionRetryPeriod
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
  cleanupController:
    replicas: 1
    image: { tag: "v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee" }
    extraArgs:
      leaderElectionRetryPeriod: *kyvernoLeaderElectionRetryPeriod
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
  reportsController:
    replicas: 1
    image: { tag: "v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03" }
    extraArgs:
      leaderElectionRetryPeriod: *kyvernoLeaderElectionRetryPeriod
    # -- Raises memory to `96Mi` request / `256Mi` limit on `mgmt` (`values/role-mgmt.yaml`) for initial object-list peaks.
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
    rbac:
      clusterRole:
        # platform: kyverno-policies' image/registry policies match pods/ephemeralcontainers (kubectl debug). Without
        # read access the reports controller marks them RBACPermissionsGranted=False (not Ready, Argo Degraded).
        extraResources:
          - apiGroups: [""]
            resources: [pods/ephemeralcontainers]
            verbs: [get, list, watch]
