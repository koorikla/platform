# KEDA on workload clusters, opt-in per cluster (`addons: { keda: true }`); docs/data-services.md "KEDA".
# Components, RBAC, certificates and metrics: README.md "Design notes".

namespace:
  # -- `restricted` Pod Security admission label on namespace `keda`.
  podSecurity: restricted           # Pod Security admission level enforced on the operator namespace ("" = no labels)
  # Istio ambient mesh client (#53): the KEDA operator queries scaler endpoints
  # (an app's metrics URL, Kafka, Prometheus) in cell namespaces, which enforce STRICT mTLS (addon
  # kyverno-policies templates/cell-mesh.yaml) and refuse plaintext from outside the mesh. Inert without Istio.
  ambient: true

keda:
  # Images: multi-arch (amd64, arm64), pinned by digest (tag kept for readability; Renovate bumps both).
  image:
    keda:
      registry: ghcr.io
      repository: kedacore/keda
      # -- `2.21.0` pinned by multi-arch index digest (alongside `image.metricsApiServer` and `image.webhooks`).
      tag: "2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809"
    metricsApiServer:
      registry: ghcr.io
      repository: kedacore/keda-metrics-apiserver
      tag: "2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881"
    webhooks:
      registry: ghcr.io
      repository: kedacore/keda-admission-webhooks
      tag: "2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1"
    pullPolicy: IfNotPresent        # upstream Always: pointless for digest references
  crds:
    # -- `true` (applied server-side).
    install: true                   # applied with ServerSideApply (every addon Application syncs server-side)
  certificates:
    # -- `false` (uses cert-manager certificates).
    autoGenerated: false
    certManager:
      enabled: true
      generateCA: true              # self-signed CA + Issuer in the keda namespace; cainjector fills the caBundles
  # Pod Security restricted: upstream already drops ALL, no privilege escalation, read-only root, RuntimeDefault
  # seccomp and runAsNonRoot; restated here so an upstream default change cannot silently loosen it (unit-tested).
  podSecurityContext:
    operator: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
    metricServer: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
    webhooks: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
  resources:                        # platform: upstream requests 100m/100Mi, limits 1 CPU / 1000Mi per pod
    operator:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
    metricServer:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
    webhooks:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 256Mi }
  prometheus:
    operator:
      enabled: true
      serviceMonitor: { enabled: true }
    metricServer:
      enabled: true
      serviceMonitor: { enabled: true }
    webhooks:
      enabled: true
      serviceMonitor: { enabled: true }
