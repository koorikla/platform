# Harbor on mgmt (docs/build-plane.md): upstream chart plus Gateway, registry PKI, secrets and a config Job.
# Objects, images and how every client reaches the endpoint: README.md "Design notes".

# --- generated by the addon ApplicationSet / installation.yaml (defaults so `helm template` works standalone) -------
cluster: { name: mgmt }
registry:
  # -- Registry mode, `host` (`harbor.externalURL` via `installationParameters`), `appsProject`, and upstream `proxyCache` projects.
  type: harbor                              # harbor | external (installation.yaml); this addon needs harbor
  host: harbor.openchoreo.localhost:9443    # <name>[:port] in image refs, Harbor externalURL, node pulls
  appsProject: apps                         # pushed by in-cluster builds (OpenChoreo workflow plane)
  # Proxy-cache projects: <upstream registry> -> Harbor project. Nodes pull <upstream>/<repo> through
  # <host>/<project>/<repo> (k3s mirror + rewrite, falls back to the upstream). Endpoint details: config.endpoints.
  proxyCache:
    - { upstream: docker.io, project: dockerhub }
    - { upstream: ghcr.io, project: ghcr }
    - { upstream: quay.io, project: quay }
    - { upstream: registry.k8s.io, project: k8s }
    - { upstream: cr.openchoreo.dev, project: openchoreo }
    - { upstream: gcr.io, project: gcr }

# --- platform glue -----------------------------------------------------------------------------------------------
# Secrets (never committed; seeded by `task secrets` locally, created by the operator in aws/vault):
#   key `harbor`: admin-password, secret-key (16 chars), core-secret, csrf-key (32 chars), jobservice-secret,
#                 registry-http-secret, registry-password, database-password, builder-secret, nodes-secret
#                 (robot secrets: >= 8 chars with upper, lower and digit - Harbor's password policy)
#   key `platform-ghcr`: username, token (GHCR proxy cache + replication of ghcr.io/koorikla/*; read:packages)
secrets:
  # -- Pulls Harbor admin, robot, and component credentials (`secrets.{store,remoteKey,ghcrKey,secretName}`) from `ClusterSecretStore/platform`.
  store: platform
  remoteKey: harbor
  ghcrKey: ""            # store key with GHCR username/token (read:packages) for private ghcr.io packages, e.g.
                          # platform-ghcr. Empty: anonymous GHCR proxy cache (public packages), replication off.
  secretName: harbor-platform               # == harbor.existingSecret* / core / jobservice / registry below

pki:
  # -- Issues `harbor-tls` (`pki.{caIssuer,tlsSecret}`), exposes Harbor via `gateway.{name,className}` (`kgateway`), and exports the public CA via `ClusterSecretStore/mgmt-harbor`.
  caIssuer: harbor-ca                       # namespaced Issuer + CA Secret in ns harbor; the key never leaves it
  caDuration: 87600h                        # 10y
  tlsSecret: harbor-tls                     # == harbor.expose.tls.secret.secretName
  tokenSecret: harbor-token                 # == harbor.core.secretName (JWT signing for Harbor's token service)

# Gateway `harbor` (kgateway): one HTTPS listener on the registry port, TLS terminated with harbor-tls. kgateway
# provisions Service `harbor` (LoadBalancer -> klipper hostPort on mgmt, published by k3d). Large layer pushes and
# pulls outlive Envoy's default 15s route timeout: kgateway TrafficPolicy on the chart's HTTPRoute lifts it.
gateway:
  name: harbor
  className: kgateway
  routeName: harbor-route                   # the chart's HTTPRoute (harbor.route helper)
  requestTimeout: 30m                       # live: Envoy route timeout 1800s on every Harbor route (kgateway v2.3)
  streamIdleTimeout: 5m

# Public CA publication: Secret harbor-ca-bundle holds only ca.crt (ExternalSecret from the CA Secret, templates/pki.yaml).
# The store may GET only this Secret, so consumers of `mgmt-harbor` (ExternalSecrets in fleet and workflows-*) can never
# read the CA key or Harbor's serving key. Consumers select property ca.crt.
caPublic:
  store: mgmt-harbor
  secretName: harbor-ca-bundle
  namespaces: [fleet]                        # charts/cluster capi-registries.yaml (node bootstrap)
  namespaceRegexes: ["^workflows-.+$"]       # OpenChoreo workflow run namespaces (workflows-<org namespace>)

# Desired state applied by templates/config.yaml (files/harbor-config.py, Harbor API v2.0, stdlib Python).
config:
  image: docker.io/library/python:3.14.10-alpine3.24@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  schedule: "17 * * * *"                    # re-apply hourly (drift, rotated robot secrets); also an Argo PostSync hook
  coreURL: http://harbor-core               # in-namespace Service (internal TLS off)
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  # Upstream registry endpoints, keyed by registry.proxyCache[].upstream. type = Harbor adapter.
  endpoints:
    docker.io: { type: docker-hub, url: "https://hub.docker.com" }
    ghcr.io: { type: github-ghcr, url: "https://ghcr.io", credentials: ghcr }   # private koorikla packages
    quay.io: { type: docker-registry, url: "https://quay.io" }   # Harbor 2.15 refuses the quay adapter for proxy cache
    registry.k8s.io: { type: docker-registry, url: "https://registry.k8s.io" }
    cr.openchoreo.dev: { type: docker-registry, url: "https://cr.openchoreo.dev" }
    gcr.io: { type: docker-registry, url: "https://gcr.io" }
  # Every project is private: the `nodes` robot pulls (proxy caches with GHCR credentials would otherwise republish
  # private koorikla packages anonymously).
  apps:
    autoScan: true                          # scan on push (Trivy)
    preventVulnerable: false                # pulls stay allowed; the build workflow gates on CRITICAL before signing
    severity: critical
    # Harbor blocks pulls of artifacts without a cosign signature accessory. cosign v3 writes Sigstore bundles as OCI
    # referrers; whether Harbor 2.15 counts those as signatures is unproven -> off until verified. VERIFY
    contentTrustCosign: false
  storageLimitGiB: -1                       # per project, -1 = unlimited
  replication:
    - name: ghcr-koorikla
      enabled: true
      endpoint: ghcr.io                     # config.endpoints key (pull-based)
      destProject: apps-ghcr
      filters:
        # GHCR has no catalog API; Harbor's github-ghcr adapter lists the owner's packages with the token. VERIFY
        - { type: name, value: "koorikla/**" }
        - { type: tag, value: "**" }
      cron: "0 0 */6 * * *"                 # Harbor 6-field cron
  # System-level robot accounts (name prefix robot$). Secret from secrets.remoteKey property <secretProperty>.
  robots:
    - name: builder                         # in-cluster builds: push + pull apps, read every other project
      secretProperty: builder-secret
      description: OpenChoreo workflow plane builds (push to apps)
      push: [apps]
      pull: [apps-ghcr, proxyCache]         # `proxyCache` expands to every registry.proxyCache project
    - name: nodes                           # k3s nodes (charts/cluster capi-registries.yaml)
      secretProperty: nodes-secret
      description: Node image pulls (k3s registries.yaml)
      push: []
      pull: [apps, apps-ghcr, proxyCache]

harbor:
  # externalURL comes from installation.yaml registry.host (catalog installationParameters); default for standalone
  externalURL: https://harbor.openchoreo.localhost:9443
  # Gateway API: HTTPRoute (chart expose.type route) on the Gateway `harbor` of templates/gateway.yaml, which terminates
  # TLS with harbor-tls. No nginx.
  expose:
    type: route
    tls:
      enabled: true
      certSource: none                      # TLS terminates at the Gateway listener
    route:
      parentRefs:
        - { group: gateway.networking.k8s.io, kind: Gateway, name: harbor, sectionName: https }
      hosts: [harbor.openchoreo.localhost]  # == hostname of registry.host (validated)
  ipFamily:
    ipv6:
      enabled: false

  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:                  # local-path on k3d (sizes are not enforced there)
      registry: { size: 20Gi }
      jobservice: { jobLog: { size: 1Gi } }
      database: { size: 2Gi }
      redis: { size: 1Gi }
      trivy: { size: 2Gi }

  # Every generated secret comes from Secret harbor-platform: the chart's randAlphaNum/genCA/htpasswd/lookup defaults
  # re-render on every Argo CD sync (no lookup in `helm template`) and would rotate keys each time.
  existingSecretAdminPassword: harbor-platform
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  existingSecretSecretKey: harbor-platform  # key secretKey
  core:
    replicas: 1
    image: { repository: docker.io/goharbor/harbor-core, tag: "v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112" }
    existingSecret: harbor-platform         # key secret
    secretName: harbor-token                # tls.crt/tls.key from cert-manager (templates/pki.yaml)
    existingXsrfSecret: harbor-platform
    existingXsrfSecretKey: CSRF_KEY
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  jobservice:
    replicas: 1
    image: { repository: docker.io/goharbor/harbor-jobservice, tag: "v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82" }
    existingSecret: harbor-platform
    existingSecretKey: JOBSERVICE_SECRET
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  registry:
    replicas: 1
    existingSecret: harbor-platform
    existingSecretKey: REGISTRY_HTTP_SECRET
    credentials:
      existingSecret: harbor-platform       # keys REGISTRY_PASSWD, REGISTRY_HTPASSWD
    registry:
      image: { repository: docker.io/goharbor/registry-photon, tag: "v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3" }
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: "1", memory: 512Mi }
    controller:
      image: { repository: docker.io/goharbor/harbor-registryctl, tag: "v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7" }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
  portal:
    replicas: 1
    image: { repository: docker.io/goharbor/harbor-portal, tag: "v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75" }
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }
  trivy:
    enabled: true
    replicas: 1
    image: { repository: docker.io/goharbor/trivy-adapter-photon, tag: "v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9" }
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: "1", memory: 1Gi }
  database:
    type: internal
    internal:
      image: { repository: docker.io/goharbor/harbor-db, tag: "v2.15.4@sha256:a32d51e636d76303e086a7c5251a2c8415c6f165b2f87bafa914efd866c5403f" }
      # Placeholder only: the chart has no existingSecret for its internal PostgreSQL. The real password reaches the
      # database container through extraEnvVars (env wins over the chart's envFrom) and core through
      # database.external.existingSecret, which core-dpl.yaml honours for both database types (live: both read
      # Secret harbor-platform, core serves pushes).
      password: set-from-secret-harbor-platform
      extraEnvVars:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: harbor-platform, key: POSTGRES_PASSWORD }
      resources:
        requests: { cpu: 25m, memory: 128Mi }
        limits: { cpu: "1", memory: 512Mi }
      shmSizeLimit: 128Mi
    external:
      existingSecret: harbor-platform       # key password (core's POSTGRESQL_PASSWORD)
  redis:
    type: internal
    internal:
      image: { repository: docker.io/goharbor/valkey-photon, tag: "v2.15.4@sha256:bb022e8f236f56f53cee7bb1f609595e497da67d829048e0af2284f97e6eb54f" }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
  metrics:
    enabled: false
  trace:
    enabled: false
  cache:
    enabled: false
