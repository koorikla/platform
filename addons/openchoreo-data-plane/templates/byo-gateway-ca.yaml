{{- /* provider byo (no ClusterResourceSet): rebuilds ConfigMap cluster-gateway-ca from the Secret mgmt pushes (PushSecret
writes only Secrets). docs/providers.md "Bring your own cluster (byo)". */ -}}
{{- if .Values.byoDelivery.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-gateway-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openchoreo
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.byoDelivery.store }}
  target:
    name: {{ index .Values "openchoreo-data-plane" "clusterAgent" "tls" "serverCAConfigMap" }}
    creationPolicy: Owner
    manifest:
      apiVersion: v1
      kind: ConfigMap
  data:
    - secretKey: ca.crt
      remoteRef:
        key: cluster-gateway-ca
        property: ca.crt
{{- end }}
