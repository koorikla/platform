{{- /* Agent RBAC for the kinds the platform's ClusterTraits / ClusterResourceTypes render that upstream's ClusterRole
lacks (#70); a grant for a kind whose addon is off is inert. hack/tests/test_openchoreo_types.sh. */ -}}
{{- with .Values.clusterAgentDataServices }}
{{- if .enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-dataplane-data-services
  labels:
    app.kubernetes.io/component: cluster-agent
    app.kubernetes.io/part-of: openchoreo
rules:
  {{- range .rules }}
  - apiGroups: [{{ .apiGroup | quote }}]
    resources: {{ .resources | toJson }}
    verbs: [get, list, watch, create, update, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-dataplane-data-services
  labels:
    app.kubernetes.io/component: cluster-agent
    app.kubernetes.io/part-of: openchoreo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-agent-dataplane-data-services
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
