{{- /* Capability gate (#246): a Sync hook in wave -1 holds the cluster agent (wave 0) back until the CRDs of every enabled
capabilityGate.addons entry exist (one init container per addon) and are Established. Why and how to debug it:
docs/data-services.md "KEDA and OpenChoreo workloads". */ -}}
{{- $crds := list }}
{{- $waits := list }}{{/* (addon, crds) per enabled addon, in key order */}}
{{- range $addon, $cfg := .Values.capabilityGate.addons }}
{{- if eq (toString $cfg.enabled) "true" }}
{{- $addonCrds := list }}
{{- range $cfg.crds }}{{ $addonCrds = append $addonCrds (printf "crd/%s" .) }}{{ end }}
{{- $crds = concat $crds $addonCrds }}
{{- $waits = append $waits (dict "addon" $addon "crds" $addonCrds) }}
{{- end }}
{{- end }}
{{- if $crds }}
{{- $labels := dict "app.kubernetes.io/name" "capability-gate" "app.kubernetes.io/part-of" "openchoreo" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capability-gate
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # before the hook that runs as it
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openchoreo-data-plane-capability-gate
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openchoreo-data-plane-capability-gate
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openchoreo-data-plane-capability-gate
subjects:
  - { kind: ServiceAccount, name: capability-gate, namespace: {{ .Release.Namespace }} }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: capability-gate
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"   # the agent Deployment (upstream chart) is wave 0
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {{- toYaml $labels | nindent 8 }}
    spec:
      serviceAccountName: capability-gate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      {{- $container := dict "image" .Values.capabilityGate.image "imagePullPolicy" "IfNotPresent"
          "resources" (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi"))
          "securityContext" (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL"))) }}
      initContainers:
        {{- range $waits }}
        - name: wait-for-{{ .addon }}-crds
          command: {{ concat (list "kubectl" "wait" "--for=create" (printf "--timeout=%s" $.Values.capabilityGate.timeout)) .crds | toJson }}
          {{- toYaml $container | nindent 10 }}
        {{- end }}
      containers:
        - name: wait-for-established
          command: {{ concat (list "kubectl" "wait" "--for=condition=Established" "--timeout=5m") $crds | toJson }}
          {{- toYaml $container | nindent 10 }}
{{- end }}
