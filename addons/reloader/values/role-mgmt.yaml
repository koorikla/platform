# mgmt: restart Backstage when one of its ConfigMaps (label app.kubernetes.io/component=backstage) changes; the upstream
# Deployment has no config checksum annotation. No Secret RBAC. docs/project-templates.md; test_gitops_contracts.sh (9d).
reloader:
  reloader:
    watchGlobally: false   # scoped Role in the namespaces below, no ClusterRole
    namespaces:
      - openchoreo-control-plane
    autoReloadAll: true
    resourceLabelSelector: app.kubernetes.io/component=backstage
    ignoreSecrets: true
