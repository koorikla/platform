# Stakater Reloader. These defaults are the workload setup: roll workloads that opt in by annotation when a referenced
# Secret/ConfigMap changes (the cluster-agent on cert/CA renewal, app Deployments in tenant cells on secret rotation,
# #268). mgmt layers values/role-mgmt.yaml (Backstage on config change). docs/openchoreo.md.
# Cell namespaces get runtime names, so Reloader watches cluster-wide; templates/rollout-guard.yaml fences what it may
# write. Meets Pod Security `restricted`.

# -- Namespaces (besides tenant cells, label `openchoreo.dev/project`) where Reloader may roll annotated workloads.
rolloutGuard:
  platformNamespaces:
    - openchoreo-data-plane

reloader:
  fullnameOverride: reloader
  image:
    repository: ghcr.io/stakater/reloader
    tag: v1.4.24@sha256:3ab43d3eb96c59798644bf826b0444a846c0197d22ab4b6c101c4da3e1d6ef23   # index: amd64, arm64, arm/v7
  reloader:
    # -- Workload: cluster-wide watch (tenant cells have runtime names); writes fenced by templates/rollout-guard.yaml. mgmt (`values/role-mgmt.yaml`): `false` + `namespaces: [openchoreo-control-plane]`, scoped Role.
    watchGlobally: true
    # Roll via a pod-template annotation instead of injected STAKATER_* env vars, so Argo CD sees no drift.
    reloadStrategy: annotations
    ignoreJobs: true
    ignoreCronJobs: true
    readOnlyRootFileSystem: true
    deployment:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 128Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
