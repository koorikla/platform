{{- /*
ApplicationSet fleet (mgmt, argocd): installations/<inst>/clusters/<c>.yaml -> Application cluster-<c> rendering
charts/cluster into namespace fleet. Deleting (or renaming to *.yaml.disabled) the file deletes the CAPI Cluster.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: {{ .Values.installation.repoURL | quote }}
        revision: {{ .Values.installation.revision | default "HEAD" | quote }}
        files:
          - path: {{ printf "installations/%s/clusters/*.yaml" .Values.installation.name | quote }}
  template:
    metadata:
      name: {{ `'cluster-{{ .name }}'` }}
      # Background cascade lets CAPI tear the Cluster down in order; foreground deleted its dependents at once and left
      # it stuck Deleting (#115).
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      project: fleet
      source:
        repoURL: {{ .Values.installation.repoURL | quote }}
        targetRevision: {{ .Values.installation.revision | default "HEAD" | quote }}
        path: charts/cluster
        helm:
          releaseName: {{ `'cluster-{{ .name }}'` }}
          valueFiles:
            - {{ printf "../../installations/%s/installation.yaml" .Values.installation.name | quote }}
            - {{ `'../../{{ .path.path }}/{{ .path.filename }}'` }}
          # bootstrap's REGISTRY_CACHE=0 reaches the root app as a parameter; the cluster chart reads installation.yaml
          parameters:
            - name: registry.hostCache.enabled
              value: {{ .Values.registry.hostCache.enabled | toString | quote }}
      destination:
        server: https://kubernetes.default.svc
        namespace: fleet
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
        # Never give up: charts/cluster gates the Cluster on its registries ExternalSecret (wave -1, e.g. the Harbor
        # CA); a fixed retry count would leave the cluster unsynced until the next commit.
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 1m
