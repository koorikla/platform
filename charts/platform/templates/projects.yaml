{{- /* AppProjects (mgmt, argocd): platform (addons, anything), fleet (charts/cluster: CAPI + registration only),
previews (charts/preview). Tenant AppProjects come from charts/tenant. */ -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # before the ApplicationSets using it; pruned after them (reverse waves)
spec:
  description: Platform addons and management cluster components
{{- include "koorikla-lib.sourceIntegrity" . }}
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fleet
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Workload cluster provisioning (CAPI, Argo registration, OpenChoreo identities)
{{- include "koorikla-lib.sourceIntegrity" . }}
  sourceRepos:
    - {{ .Values.installation.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: fleet
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.openchoreo.orgNamespace | quote }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: openchoreo.dev
      kind: ClusterDataPlane
    - group: external-secrets.io     # provider byo: ClusterSecretStore byo-<name> (charts/cluster templates/byo/access.yaml)
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: cluster.x-k8s.io
      kind: Cluster
    - group: addons.cluster.x-k8s.io
      kind: ClusterResourceSet
    - group: cert-manager.io
      kind: Issuer
    - group: cert-manager.io
      kind: Certificate
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io     # provider byo: the ClusterResourceSet replacement (charts/cluster byo.pushSecret)
      kind: PushSecret
    - group: openchoreo.dev
      kind: Environment
---
{{- /* previews (docs/preview-environments.md): only the three OpenChoreo kinds charts/preview renders. Rendered even with
previews off: the preview Applications carry the resources finalizer and Argo CD deletes them only while it exists. */}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previews
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: PR preview environments (OpenChoreo Environment + bindings per open pull request)
{{- include "koorikla-lib.sourceIntegrity" . }}
  sourceRepos:
    - {{ .Values.installation.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.openchoreo.orgNamespace | quote }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: openchoreo.dev
      kind: Environment
    - group: openchoreo.dev
      kind: ProjectReleaseBinding
    - group: openchoreo.dev
      kind: ReleaseBinding
