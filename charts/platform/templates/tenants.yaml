{{- /*
ApplicationSet tenants (mgmt, argocd): installations/<inst>/tenants/<project>.yaml -> Application tenant-<project>
rendering charts/tenant (installation.yaml + tenant file). Removing the file offboards the tenant (resources finalizer).
*/ -}}
{{- $inst := .Values.installation.name }}
{{- $repo := .Values.installation.repoURL }}
{{- $rev := .Values.installation.revision | default "HEAD" }}
{{- $orgNs := .Values.openchoreo.orgNamespace }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $repo }}
        revision: {{ $rev }}
        files:
          - path: installations/{{ $inst }}/tenants/*.yaml
  template:
    metadata:
      name: {{ `'tenant-{{ .project }}'` }}
      labels:
        app.kubernetes.io/part-of: platform
        platform.koorikla.io/tenant: {{ `'{{ .project }}'` }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: {{ $repo }}
        targetRevision: {{ $rev }}
        path: charts/tenant
        helm:
          valueFiles:
            - ../../installations/{{ $inst }}/installation.yaml
            - {{ `'../../{{ .path.path }}/{{ .path.filename }}'` }}
          parameters:   # root app value (bootstrap.sh sets it from the seeded key), not in installation.yaml
            - name: secrets.githubGateApp.enabled
              value: {{ .Values.secrets.githubGateApp.enabled | toString | quote }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ $orgNs }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1               # OpenChoreo CRDs may not exist yet on a fresh mgmt: never give up (#192)
          refresh: true
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 1m
