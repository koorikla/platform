{{- /*
One ApplicationSet addon-<name> per catalog entry (values.yaml `addons`), on mgmt in argocd: an Application
<name>-<cluster> per Argo CD cluster secret whose labels match the entry. Layering: docs/architecture.md "Addons".
*/ -}}
{{- $inst := .Values.installation -}}
{{- /* koorikla-lib: the values scope Helm adds for the library dependency (charts/lib), not an installation value. */ -}}
{{- $instValues := omit .Values "addons" "koorikla-lib" -}}
{{- /* goTemplate expressions the ApplicationSet controller evaluates per cluster secret; hack/lib/addons.sh mirrors them. */ -}}
{{- $label := dict -}}
{{- range list "name" "role" "provider" "region" "environment" "cni" -}}
{{- $_ := set $label . (printf "{{ index .metadata.labels \"platform.koorikla.io/%s\" }}" .) -}}
{{- end -}}
{{- $serverExpr := dict
  "url"  "{{ .server }}"
  "host" "{{ (urlParse .server).hostname }}"
  "port" "{{ $h := (urlParse .server).host }}{{ if regexMatch \":[0-9]+$\" $h }}{{ regexFind \"[0-9]+$\" $h }}{{ else }}443{{ end }}"
-}}
{{- /* Per-cluster pin (cluster secret annotation addons-revision), else installation.revision. */ -}}
{{- $targetRevision := printf `'{{ $r := index .metadata.annotations "platform.koorikla.io/addons-revision" }}{{ if and $r (ne $r "HEAD") }}{{ $r }}{{ else }}%s{{ end }}'` ($inst.revision | default "HEAD") -}}
{{- range $addon, $cfg := .Values.addons }}
{{- /* Cluster selector: role (+ provider), then the per-cluster toggle label: opt-out (NotIn false) when default is
true or unset, opt-in (In true) when default is false. */}}
{{- $optOut := hasKey $cfg "default" | ternary $cfg.default true }}
{{- $match := list (dict "key" "platform.koorikla.io/role" "operator" "In" "values" $cfg.roles) }}
{{- with $cfg.providers }}
{{- $match = append $match (dict "key" "platform.koorikla.io/provider" "operator" "In" "values" .) }}
{{- end }}
{{- $match = append $match (dict "key" (printf "addons.platform.koorikla.io/%s" $addon) "operator" (ternary "NotIn" "In" $optOut) "values" (list (ternary "false" "true" $optOut))) }}
{{- $generators := list (dict "clusters" (dict "selector" (dict "matchExpressions" $match))) }}
{{- /* fleetParameters: matrix with one flat-list element {clusters: [every platform cluster]}, so each Application still
targets one cluster but sees the whole fleet (argo-events: one Falco endpoint per cluster). */}}
{{- $fleet := $cfg.fleetParameters | default list }}
{{- if $fleet }}
{{- $allClusters := dict "clusters" (dict "flatList" true "selector" (dict "matchExpressions" (list (dict "key" "platform.koorikla.io/name" "operator" "Exists")))) }}
{{- $generators = list (dict "matrix" (dict "generators" (append $generators $allClusters))) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "addon-%s" $addon | quote }}
  namespace: argocd
spec:
  goTemplate: true
  generators:
    {{- toYaml $generators | nindent 4 }}
  template:
    metadata:
      name: {{ printf "'%s-{{ .name }}'" $addon }}
      {{- /* Which addons need which compare option: the catalog header in values.yaml (#184, #281). */}}
      {{- with $cfg.compareOptions }}
      annotations:
        argocd.argoproj.io/compare-options: {{ join "," . | quote }}
      {{- end }}
    spec:
      project: platform
      source:
        repoURL: {{ $inst.repoURL | quote }}
        targetRevision: {{ $targetRevision }}
        path: {{ $cfg.path | default (printf "addons/%s" $addon) | quote }}
        helm:
          releaseName: {{ $cfg.releaseName | default $addon | quote }}
          ignoreMissingValueFiles: true
          valueFiles:
            {{- /* valuesFromAddons: other catalog addons' chart values first (lowest precedence), read as their single source */}}
            {{- range $from := $cfg.valuesFromAddons }}
            {{- $src := get $.Values.addons $from }}
            {{- if or (not $src) (eq $from $addon) }}{{ fail (printf "addons.%s.valuesFromAddons: %q is not another addon of the catalog" $addon $from) }}{{ end }}
            - {{ printf "../../%s/values.yaml" ($src.path | default (printf "addons/%s" $from)) | quote }}
            {{- end }}
            - values.yaml
            - 'values/role-{{ $label.role }}.yaml'
            - 'values/provider-{{ $label.provider }}.yaml'
            - 'values/cni-{{ $label.cni }}.yaml'
            {{- /* mesh members (fleet file mesh.group -> label mesh.platform.koorikla.io/group) */}}
            - {{ `'values/mesh-{{ if index .metadata.labels "mesh.platform.koorikla.io/group" }}member{{ else }}none{{ end }}.yaml'` }}
            {{- range $f := $cfg.installationValueFiles }}
            {{- $path := tpl $f $ }}
            {{- if or (hasPrefix "/" $path) (contains ".." $path) (contains "{{" $path) (not (hasPrefix "values/" $path)) }}
            {{- fail (printf "addons.%s.installationValueFiles: %q must be a file under addons/%s/values/" $addon $path $addon) }}
            {{- end }}
            - {{ $path | quote }}
            {{- end }}
            - {{ printf "../../installations/%s/addons/%s/values.yaml" $inst.name $addon | quote }}
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/env-{{ $label.environment }}.yaml'
            - '../../installations/{{ $inst.name }}/addons/{{ $addon }}/cluster-{{ $label.name }}.yaml'
          {{- if or $cfg.clusterNameParameters $cfg.clusterNameFormats $cfg.clusterIdParameters $cfg.installationParameters $cfg.clusterServerParameters $cfg.clusterLabelParameters $fleet }}
          parameters:
            {{- range $p := $cfg.clusterNameParameters }}
            - name: {{ $p | quote }}
              value: '{{ $label.name }}'
              forceString: true
            {{- end }}
            {{- range $p, $f := $cfg.clusterNameFormats }}
            - name: {{ $p | quote }}
              value: {{ printf $f $label.name | squote }}
              forceString: true
            {{- end }}
            {{- range $p := $fleet }}
            - name: {{ $p | quote }}
              value: {{ `'{{ $n := list }}{{ range .clusters }}{{ $n = append $n (index .metadata.labels "platform.koorikla.io/name") }}{{ end }}{{ printf "{%s}" (join "," (sortAlpha $n)) }}'` }}
            {{- end }}
            {{- range $p := $cfg.clusterIdParameters }}
            - name: {{ $p | quote }}
              value: '{{ $inst.name }}-{{ $label.name }}'
              forceString: true
            {{- end }}
            {{- range $p, $t := $cfg.installationParameters }}
            - name: {{ $p | quote }}
              value: {{ tpl $t $ | quote }}
            {{- end }}
            {{- range $p, $part := $cfg.clusterServerParameters }}
            - name: {{ $p | quote }}
              value: {{ index $serverExpr $part | squote }}
              {{- if ne $part "port" }}
              forceString: true
              {{- end }}
            {{- end }}
            {{- range $p, $l := $cfg.clusterLabelParameters }}
            - name: {{ $p | quote }}
              {{- if ne (get $l "default" | default "") "" }}
              value: {{ printf `'{{ $v := index .metadata.labels %q }}{{ if $v }}{{ $v }}{{ else }}%s{{ end }}'` $l.label $l.default }}
              {{- else }}
              value: {{ printf `'{{ index .metadata.labels %q }}'` $l.label }}
              {{- end }}
              forceString: true
            {{- end }}
          {{- end }}
          valuesObject:
            cluster:
              name: '{{ $label.name }}'
              role: '{{ $label.role }}'
              provider: '{{ $label.provider }}'
              region: '{{ $label.region }}'
              environment: '{{ $label.environment }}'
              cni: '{{ $label.cni }}'
            {{- toYaml $instValues | nindent 12 }}
      destination:
        server: '{{ "{{ .server }}" }}'
        namespace: {{ $cfg.namespace | quote }}
      {{- with $cfg.ignoreDifferences }}
      ignoreDifferences:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          {{- if $cfg.ignoreDifferences }}
          - RespectIgnoreDifferences=true   # sync must not revert fields a controller owns (e.g. istiod's webhook policy)
          {{- end }}
          {{- if $cfg.serverSideDiff }}
          - ServerSideDiff=true
          {{- end }}
        # Never give up: an addon can wait on another app's CRDs longer than any fixed budget (#192); the 1m cap
        # bounds the idle time after the dependency turns healthy.
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 1m
{{- end }}
