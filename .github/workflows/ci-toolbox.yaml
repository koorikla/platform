name: toolbox

# Builds ghcr.io/koorikla/platform/ci-toolbox with the same app-container.yaml app repos use, then smoke-tests
# the pushed image on amd64 and arm64. Lives under this repo's namespace so GITHUB_TOKEN owns the package (#254).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci-toolbox.yaml'
      - 'ci/toolbox/**'
      - 'ci/scripts/**'
  push:
    # ci/ releases (release-please tags `ci-vX.Y.Z`) publish a tagged toolbox; platform
    # `v*` releases do not (paths are not evaluated for tag pushes).
    tags: ['ci-v*']
    branches: [main]
    paths:
      - '.github/workflows/ci-toolbox.yaml'
      - 'ci/toolbox/**'
      - 'ci/scripts/**'

concurrency:
  group: toolbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/app-container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      registry: ghcr.io/koorikla/platform
      image_name: ci-toolbox
      context: ci
      dockerfile: ci/toolbox/Dockerfile

  smoke:
    name: smoke ${{ matrix.runner }}
    needs: image
    if: needs.image.outputs.image_digest_ref != ''
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run toolbox-smoke
        env:
          IMAGE: ${{ needs.image.outputs.image_digest_ref }}
        run: docker run --rm "$IMAGE" toolbox-smoke
