name: java

# JVM service (Quarkus, Spring Boot or plain Java; Maven or Gradle): checks (ci/README.md#what-gets-checked-per-stack),
# then app-container.yaml. Dockerfiles: templates/dockerfiles/{quarkus,quarkus-native,spring-boot}.Dockerfile.
#
# Required caller permissions:
#   contents: read, actions: read, packages: write, id-token: write, attestations: write, security-events: write

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Project directory (pom.xml or build.gradle[.kts])'
        type: string
        default: '.'
      build_tool:
        description: 'auto, maven or gradle'
        type: string
        default: 'auto'
      java_version:
        description: 'JDK version for setup-java'
        type: string
        default: '25'
      java_distribution:
        description: 'JDK distribution for setup-java'
        type: string
        default: 'temurin'
      run_tests:
        description: 'Run tests (JaCoCo coverage)'
        type: boolean
        default: true
      build_tool_args:
        description: 'Extra Maven/Gradle arguments for the check build (e.g. -Pci)'
        type: string
        default: ''
      native:
        description: 'Quarkus native image (Mandrel, per-arch native build); default Dockerfile becomes <working_directory>/Dockerfile.native'
        type: boolean
        default: false
      run_osv:
        description: 'Run osv-scanner on the CycloneDX SBOM (gated like Trivy, on CVSS)'
        type: boolean
        default: true
      run_codeql:
        description: 'Run CodeQL (java-kotlin)'
        type: boolean
        default: true
      codeql_build_mode:
        description: "CodeQL build mode: none (Java) or autobuild (needed for Kotlin)"
        type: string
        default: 'none'
      # OpenChoreo manifests: app-openchoreo-manifests.yaml (schemas + repo invariants), same in every app-<stack>.yaml.
      openchoreo_manifests: {type: string, default: 'deploy/openchoreo', description: "OpenChoreo manifests directory ('' skips)"}
      # Image phase: passed to app-container.yaml unchanged; ci/tests/app-workflow-interfaces.test.sh guards drift.
      build_container: {type: boolean, default: true, description: 'Build/scan/sign the container image after checks'}
      image_name: {type: string, default: '', description: 'Image name (default: repository name)'}
      registry: {type: string, default: '', description: 'Registry prefix (default ghcr.io/<owner>)'}
      context: {type: string, default: '', description: 'Docker build context (default working_directory)'}
      dockerfile: {type: string, default: '', description: 'Dockerfile (default <working_directory>/Dockerfile, or Dockerfile.native with native: true)'}
      platforms: {type: string, default: 'linux/amd64,linux/arm64', description: 'Comma-separated image platforms'}
      multiarch_strategy: {type: string, default: 'native', description: 'native (per-arch runners) or qemu'}
      build_args: {type: string, default: '', description: 'Newline-separated extra build-args'}
      push: {type: boolean, default: true, description: 'Push, attest and sign on non-PR events'}
      trivy_severity: {type: string, default: 'CRITICAL', description: 'Severities that fail the Trivy scans (image and lockfiles)'}
      trivy_ignore_unfixed: {type: boolean, default: true, description: 'Ignore unfixed vulnerabilities'}
      trivy_ignore_file: {type: string, default: '', description: 'Repo-relative .trivyignore(.yaml) with accepted risks'}
      trivy_fail: {type: boolean, default: true, description: 'Fail on Trivy findings at trivy_severity'}
    secrets:
      registry_username: {description: 'Registry username (non-GHCR registries)'}
      registry_password: {description: 'Registry password/token (non-GHCR registries)'}
    outputs:
      image: {description: 'Image reference tagged with the short SHA', value: '${{ jobs.container.outputs.image }}'}
      image_ref: {description: 'Alias of image', value: '${{ jobs.container.outputs.image_ref }}'}
      image_repo: {description: 'Image repository without tag', value: '${{ jobs.container.outputs.image_repo }}'}
      digest: {description: 'Manifest-list digest', value: '${{ jobs.container.outputs.digest }}'}
      image_digest_ref: {description: 'Immutable <repo>@sha256:... reference', value: '${{ jobs.container.outputs.image_digest_ref }}'}
      short_sha: {description: '7-character commit SHA', value: '${{ jobs.container.outputs.short_sha }}'}

permissions:
  contents: read

jobs:
  test:
    name: build, test, JaCoCo, SBOM, dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: java-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ inputs.native }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch platform ci/scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/platform}.git" "${CI_SHA:-main}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/ci/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Detect build tool and framework
        id: detect
        env:
          WORKDIR: ${{ inputs.working_directory }}
          BUILD_TOOL: ${{ inputs.build_tool }}
          NATIVE: ${{ inputs.native }}
        run: |
          bash "$CI_SCRIPTS/java/detect.sh"
          slug="$(printf '%s' "${WORKDIR}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "artifact=java-reports-${slug}-$([ "$NATIVE" = true ] && echo native || echo jvm)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: ${{ steps.detect.outputs.build_tool == 'maven' && 'maven' || '' }}
          cache-dependency-path: ${{ steps.detect.outputs.build_tool == 'maven' && format('{0}/**/pom.xml', inputs.working_directory) || '' }}

      - name: Set up Gradle (cache, wrapper validation)
        if: steps.detect.outputs.build_tool == 'gradle'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          add-job-summary: on-failure

      - name: Build, test, JaCoCo, CycloneDX SBOM
        id: check
        env:
          WORKDIR: ${{ inputs.working_directory }}
          BUILD_TOOL: ${{ steps.detect.outputs.build_tool }}
          RUN_TESTS: ${{ inputs.run_tests }}
          BUILD_ARGS: ${{ inputs.build_tool_args }}
        run: bash "$CI_SCRIPTS/java/check.sh"

      - name: Upload SBOM and coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.detect.outputs.artifact }}
          path: |
            ${{ env.CI_OUT_DIR }}/bom.cdx.json
            ${{ inputs.working_directory }}/**/site/jacoco/
            ${{ inputs.working_directory }}/**/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - name: Trivy scan of the SBOM (or lockfiles)
        id: fsscan
        env:
          SBOM_FILE: ${{ steps.check.outputs.sbom }}
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          IGNORE_FILE: ${{ inputs.trivy_ignore_file }}
          SKIP_DIRS: ${{ steps.check.outputs.sbom == '' && '**/target,**/build,**/.gradle' || '' }}
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-deps-java-${{ inputs.working_directory }}-${{ inputs.native && 'native' || 'jvm' }}

      - name: osv-scanner (SBOM or manifests)
        if: inputs.run_osv
        env:
          SCAN_TARGET: ${{ steps.check.outputs.sbom != '' && steps.check.outputs.sbom || inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
        run: bash "$CI_SCRIPTS/common/osv-scan.sh"

  codeql:
    name: CodeQL (java-kotlin)
    if: inputs.run_codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: java-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ inputs.native }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: CodeQL init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: ${{ inputs.codeql_build_mode }}
          source-root: ${{ inputs.working_directory }}

      - name: CodeQL autobuild
        if: inputs.codeql_build_mode == 'autobuild'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          working-directory: ${{ inputs.working_directory }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin/${{ inputs.working_directory }}

  manifests:
    uses: $/.github/workflows/app-openchoreo-manifests.yaml
    permissions:
      contents: read
    with:
      directory: ${{ inputs.openchoreo_manifests }}

  container:
    name: image
    needs: [test, codeql]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: $/.github/workflows/app-container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format(inputs.native && '{0}/Dockerfile.native' || '{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
      trivy_ignore_file: ${{ inputs.trivy_ignore_file }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
