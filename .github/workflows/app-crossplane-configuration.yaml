name: crossplane-configuration

# Crossplane configuration package or Crossplane Project: validate, render every example XR (diff vs
# tests/render/expected/), build, push, sign, attest. Checks: ci/README.md#what-gets-checked-per-stack.
#
# Required caller permissions:
#   contents: read, packages: write, id-token: write, attestations: write

on:
  workflow_call:
    inputs:
      package_root:
        description: 'Directory containing crossplane-project.yaml (Crossplane Project, the default layout) or crossplane.yaml (classic package)'
        type: string
        default: '.'
      examples_dir:
        description: 'Example XRs (relative to package_root); bundled into the package'
        type: string
        default: 'examples'
      render_dir:
        description: 'Render test assets relative to package_root (functions.yaml, expected/, observed/, extra-resources/)'
        type: string
        default: 'tests/render'
      ignore:
        description: 'Extra comma-separated xpkg build --ignore patterns'
        type: string
        default: ''
      crossplane_version:
        description: 'Crossplane CLI version'
        type: string
        default: 'v2.5.0'
      package_name:
        description: 'Package (OCI repository) name (default: metadata.name in crossplane.yaml)'
        type: string
        default: ''
      registry:
        description: 'Registry prefix (default ghcr.io/<owner>)'
        type: string
        default: ''
      push:
        description: 'Push and sign on non-PR events'
        type: boolean
        default: true
    secrets:
      registry_username:
        description: 'Registry username (non-GHCR registries)'
      registry_password:
        description: 'Registry password/token (non-GHCR registries)'
    outputs:
      package:
        description: 'Package reference tagged with the short SHA'
        value: ${{ jobs.package.outputs.package }}
      digest:
        description: 'Pushed package digest (empty on PRs)'
        value: ${{ jobs.package.outputs.digest }}
      package_digest_ref:
        description: 'Immutable <repo>@sha256:... reference (empty on PRs)'
        value: ${{ jobs.package.outputs.package_digest_ref }}
      function_digest_ref:
        description: 'Pushed embedded function repo@digest of a Crossplane Project (empty on PRs and without one)'
        value: ${{ jobs.package.outputs.function_digest_ref }}

permissions:
  contents: read

jobs:
  validate:
    name: validate + render tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: xp-config-validate-${{ github.repository }}-${{ inputs.package_root }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch platform ci/scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/platform}.git" "${CI_SHA:-main}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/ci/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Install Crossplane CLI
        env:
          CROSSPLANE_VERSION: ${{ inputs.crossplane_version }}
        run: bash "$CI_SCRIPTS/crossplane/install-cli.sh"

      - name: Cache Crossplane schema cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xp-cache
          key: xp-schemas-${{ hashFiles(format('{0}/crossplane.yaml', inputs.package_root), format('{0}/crossplane-project.yaml', inputs.package_root), format('{0}/{1}/functions.yaml', inputs.package_root, inputs.render_dir)) }}

      - name: Validate and render
        env:
          PACKAGE_ROOT: ${{ inputs.package_root }}
          EXAMPLES_DIR: ${{ inputs.examples_dir }}
          RENDER_DIR: ${{ inputs.render_dir }}
          CACHE_DIR: ${{ runner.temp }}/xp-cache
        run: bash "$CI_SCRIPTS/crossplane/validate-render.sh"

      - name: Upload rendered output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crossplane-render-${{ github.run_attempt }}
          path: ${{ env.CI_OUT_DIR }}/render
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: xpkg build, push, sign
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: xp-config-package-${{ github.repository }}-${{ inputs.package_root }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      package: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      package_digest_ref: ${{ steps.push.outputs.image_digest_ref }}
      function_digest_ref: ${{ steps.push.outputs.function_digest_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch platform ci/scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/platform}.git" "${CI_SHA:-main}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/ci/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Install Crossplane CLI
        env:
          CROSSPLANE_VERSION: ${{ inputs.crossplane_version }}
        run: bash "$CI_SCRIPTS/crossplane/install-cli.sh"

      - name: Package name
        id: pkgname
        env:
          PACKAGE_ROOT: ${{ inputs.package_root }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: bash "$CI_SCRIPTS/crossplane/package-name.sh"

      - name: Compute package coordinates
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ steps.pkgname.outputs.name }}
          INPUT_PUSH: ${{ inputs.push }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash "$CI_SCRIPTS/common/image-meta.sh"

      - name: Package tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.repo }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=match,pattern=^[a-z0-9-]+-v(\d+\.\d+\.\d+)$,group=1,prefix=v

      - name: xpkg build
        id: build
        env:
          PACKAGE_ROOT: ${{ inputs.package_root }}
          EXAMPLES_DIR: ${{ inputs.examples_dir }}
          IGNORE: ${{ inputs.ignore }}
          REPOSITORY: ${{ steps.vars.outputs.repo }}
        run: bash "$CI_SCRIPTS/crossplane/xpkg-build.sh"

      - name: Log in to registry
        if: steps.vars.outputs.should_push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.vars.outputs.registry_host }}
          username: ${{ secrets.registry_username || github.actor }}
          password: ${{ secrets.registry_password || github.token }}

      - name: xpkg push
        id: push
        if: steps.vars.outputs.should_push == 'true'
        env:
          PACKAGE_FILES: ${{ steps.build.outputs.xpkg }}
          PROJECT_ROOT: ${{ steps.build.outputs.mode == 'project' && inputs.package_root || '' }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash "$CI_SCRIPTS/crossplane/xpkg-push.sh"

      - name: Attest SLSA build provenance
        if: steps.vars.outputs.should_push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        if: steps.vars.outputs.should_push == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign keyless sign
        if: steps.vars.outputs.should_push == 'true'
        env:
          IMAGE_DIGEST_REF: ${{ steps.push.outputs.image_digest_ref }}
          RECURSIVE: 'false'
        run: bash "$CI_SCRIPTS/common/sign-image.sh"

      # A Crossplane Project's embedded function (functions/<fn>/, pushed as the multi-arch index <repo>_<fn>):
      # attested and signed recursively like the Configuration. Skipped when there is none.
      - name: Attest SLSA build provenance (embedded function)
        if: steps.vars.outputs.should_push == 'true' && steps.push.outputs.function_digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.function_repo }}
          subject-digest: ${{ steps.push.outputs.function_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Cosign keyless sign (embedded function)
        if: steps.vars.outputs.should_push == 'true' && steps.push.outputs.function_digest != ''
        env:
          IMAGE_DIGEST_REF: ${{ steps.push.outputs.function_digest_ref }}
          RECURSIVE: 'true'
        run: bash "$CI_SCRIPTS/common/sign-image.sh"
