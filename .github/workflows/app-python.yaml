name: python

# Python service (uv): checks (ci/README.md#what-gets-checked-per-stack), then app-container.yaml.
# Expects a Dockerfile like templates/dockerfiles/python.Dockerfile.
#
# Required caller permissions:
#   contents: read, actions: read, packages: write, id-token: write, attestations: write, security-events: write

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory containing pyproject.toml and uv.lock'
        type: string
        default: '.'
      python_version:
        description: 'Python version (default: .python-version / requires-python, installed by uv)'
        type: string
        default: ''
      uv_version:
        description: 'uv version (default: [tool.uv] required-version or latest)'
        type: string
        default: ''
      run_lint:
        description: 'Run ruff check + ruff format --check'
        type: boolean
        default: true
      run_typecheck:
        description: "Run mypy: 'auto' (when locked), 'true' or 'false'"
        type: string
        default: 'auto'
      run_test:
        description: 'Run pytest (coverage with pytest-cov)'
        type: boolean
        default: true
      test_args:
        description: 'Extra pytest arguments'
        type: string
        default: ''
      run_audit:
        description: 'Run pip-audit on the runtime dependencies'
        type: boolean
        default: true
      audit_ignore:
        description: 'Space-separated vulnerability IDs pip-audit ignores (accepted risks)'
        type: string
        default: ''
      run_codeql:
        description: 'Run CodeQL (python)'
        type: boolean
        default: true
      # OpenChoreo manifests: app-openchoreo-manifests.yaml (schemas + repo invariants), same in every app-<stack>.yaml.
      openchoreo_manifests: {type: string, default: 'deploy/openchoreo', description: "OpenChoreo manifests directory ('' skips)"}
      # Image phase: passed to app-container.yaml unchanged; ci/tests/app-workflow-interfaces.test.sh guards drift.
      build_container: {type: boolean, default: true, description: 'Build/scan/sign the container image after checks'}
      image_name: {type: string, default: '', description: 'Image name (default: repository name)'}
      registry: {type: string, default: '', description: 'Registry prefix (default ghcr.io/<owner>)'}
      context: {type: string, default: '', description: 'Docker build context (default working_directory)'}
      dockerfile: {type: string, default: '', description: 'Dockerfile (default <working_directory>/Dockerfile)'}
      platforms: {type: string, default: 'linux/amd64,linux/arm64', description: 'Comma-separated image platforms'}
      multiarch_strategy: {type: string, default: 'native', description: 'native (per-arch runners) or qemu'}
      build_args: {type: string, default: '', description: 'Newline-separated extra build-args'}
      push: {type: boolean, default: true, description: 'Push, attest and sign on non-PR events'}
      trivy_severity: {type: string, default: 'CRITICAL', description: 'Severities that fail the Trivy scans (image and lockfiles)'}
      trivy_ignore_unfixed: {type: boolean, default: true, description: 'Ignore unfixed vulnerabilities'}
      trivy_ignore_file: {type: string, default: '', description: 'Repo-relative .trivyignore(.yaml) with accepted risks'}
      trivy_fail: {type: boolean, default: true, description: 'Fail on Trivy findings at trivy_severity'}
    secrets:
      registry_username: {description: 'Registry username (non-GHCR registries)'}
      registry_password: {description: 'Registry password/token (non-GHCR registries)'}
    outputs:
      image: {description: 'Image reference tagged with the short SHA', value: '${{ jobs.container.outputs.image }}'}
      image_ref: {description: 'Alias of image', value: '${{ jobs.container.outputs.image_ref }}'}
      image_repo: {description: 'Image repository without tag', value: '${{ jobs.container.outputs.image_repo }}'}
      digest: {description: 'Manifest-list digest', value: '${{ jobs.container.outputs.digest }}'}
      image_digest_ref: {description: 'Immutable <repo>@sha256:... reference', value: '${{ jobs.container.outputs.image_digest_ref }}'}
      short_sha: {description: '7-character commit SHA', value: '${{ jobs.container.outputs.short_sha }}'}

permissions:
  contents: read

jobs:
  test:
    name: ruff, pytest, pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: python-test-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch platform ci/scripts (same commit as this workflow)
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          d="$RUNNER_TEMP/koorikla-ci"
          rm -rf "$d" && git init -q "$d"
          git -C "$d" fetch -q --depth 1 "https://github.com/${CI_REPO:-koorikla/platform}.git" "${CI_SHA:-main}"
          git -C "$d" checkout -q FETCH_HEAD
          echo "CI_SCRIPTS=$d/ci/scripts" >> "$GITHUB_ENV"
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv_version }}
          python-version: ${{ inputs.python_version }}
          working-directory: ${{ inputs.working_directory }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working_directory }}/uv.lock

      - name: uv sync, ruff, mypy, pytest, pip-audit
        env:
          WORKDIR: ${{ inputs.working_directory }}
          RUN_LINT: ${{ inputs.run_lint }}
          RUN_TYPECHECK: ${{ inputs.run_typecheck }}
          RUN_TEST: ${{ inputs.run_test }}
          TEST_ARGS: ${{ inputs.test_args }}
          RUN_AUDIT: ${{ inputs.run_audit }}
          AUDIT_IGNORE: ${{ inputs.audit_ignore }}
        run: bash "$CI_SCRIPTS/python/check.sh"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - name: Trivy fs scan of lockfiles
        id: fsscan
        env:
          SCAN_PATH: ${{ inputs.working_directory }}
          FAIL_SEVERITIES: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          FAIL_ON_FINDINGS: ${{ inputs.trivy_fail }}
          IGNORE_FILE: ${{ inputs.trivy_ignore_file }}
          SKIP_DIRS: "**/.venv,**/node_modules"
        run: bash "$CI_SCRIPTS/common/scan-fs.sh"

      - name: Upload Trivy fs SARIF
        if: always() && steps.fsscan.outputs.fs_sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.fsscan.outputs.fs_sarif }}
          category: trivy-fs-python-${{ inputs.working_directory }}

  codeql:
    name: CodeQL (python)
    if: inputs.run_codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: python-codeql-${{ github.repository }}-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          source-root: ${{ inputs.working_directory }}

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python/${{ inputs.working_directory }}

  manifests:
    uses: $/.github/workflows/app-openchoreo-manifests.yaml
    permissions:
      contents: read
    with:
      directory: ${{ inputs.openchoreo_manifests }}

  container:
    name: image
    needs: [test, codeql]
    if: >-
      always() && inputs.build_container &&
      needs.test.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    uses: $/.github/workflows/app-container.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: ${{ inputs.image_name }}
      registry: ${{ inputs.registry }}
      context: ${{ inputs.context != '' && inputs.context || inputs.working_directory }}
      dockerfile: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working_directory) }}
      platforms: ${{ inputs.platforms }}
      multiarch_strategy: ${{ inputs.multiarch_strategy }}
      build_args: ${{ inputs.build_args }}
      push: ${{ inputs.push }}
      trivy_severity: ${{ inputs.trivy_severity }}
      trivy_ignore_unfixed: ${{ inputs.trivy_ignore_unfixed }}
      trivy_fail: ${{ inputs.trivy_fail }}
      trivy_ignore_file: ${{ inputs.trivy_ignore_file }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
