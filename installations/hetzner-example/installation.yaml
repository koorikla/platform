# UNTESTED EXAMPLE: never booted in this lab (Docker + k3s/CAPD only). README.md next to this file.
# Installation "hetzner-example": reference only - renders and schema-checks, never booted (no credentials).
# mgmt is any conformant cluster (e.g. k3s on a Hetzner server); workload clusters are CAPH k3s clusters on Hetzner
# Cloud (ClusterClass k3s-hetzner). Adding a cluster: docs/providers.md.
installation:
  name: hetzner-example
  repoURL: https://github.com/koorikla/platform.git
  revision: main
  githubOrg: https://github.com/koorikla
  domain: hetzner.example.com                 # VERIFY: a DNS zone you own

mgmt:
  name: mgmt
  provider: hetzner
  region: fsn1
  environment: mgmt
  addons:
    harbor: "false"                           # registry.type external
    openchoreo-observability-plane: "false"   # openchoreo.observability.enabled is false in this installation
    # external-dns: "true"                    # opt-in per cluster (mgmt + workload) once Cloudflare zone + token exist

secrets:
  backend: vault                              # ClusterSecretStore/platform -> Vault / OpenBao (no native manager)
  # githubGateApp: {enabled: true}             # once store key promotion-gate-github exists: auto-build, PR previews
  vault:
    server: https://vault.hetzner.example.com # VERIFY shape vs addons/secret-stores
    path: platform                            # KV v2 mount
    version: v2
    auth:
      kubernetes:
        mountPath: kubernetes
        role: external-secrets
  # Workload ClusterSecretStore `dns` (dns.provider cloudflare below): the Cloudflare token stays out of reach of the
  # tenant store `default`. VERIFY: Vault role bound to external-secrets/eso-vault-dns whose policy reads only key
  # external-dns-cloudflare, and the `external-secrets` role's policy denies it (docs/dns.md "Credentials").
  dnsStore:
    vault:
      role: external-secrets-dns
  nodeRegistryAuth:
    enabled: true

# Image registry (docs/build-plane.md): no Harbor in this reference installation; in-cluster builds push to GHCR.
# Switch to `type: harbor` (+ host, appsProject, proxyCache, mirror) and drop mgmt.addons.harbor to run Harbor on mgmt.
registry:
  type: external
  external:
    repository: ghcr.io/koorikla
    credentialsKey: platform-ghcr

capi:
  providers:
    docker: false
    aws: false
    hetzner: true                             # CAPH v1.1.12; token: key capi-hetzner (property hcloud)

openchoreo:
  controlPlane:
    host: openchoreo.hetzner.example.com
    clusterGatewayURL: wss://cluster-gateway.openchoreo.hetzner.example.com/ws   # VERIFY port/path with OC 1.3.3
  workflowPlane:
    enabled: true         # addon openchoreo-workflow-plane on mgmt; builds push to registry.external.repository
    # Auto-build of Components with spec.autoBuild: true: poll | webhook | none (docs/build-plane.md "Auto-build")
    autoBuild: webhook    # GitHub App push webhook via events.<host> (addon argo-events) + resync poll
  observability:
    enabled: false        # enable with installations/<inst>/addons/{openchoreo-observability-plane,telemetry} host/port overrides
    httpPort: 443         # VERIFY: real Gateway listener ports + TLS for ingest in a cloud installation
    tlsPort: 443

# Public DNS for Gateway API routes (addon external-dns, opt-in per cluster: docs/dns.md). The DNS provider is
# independent of the infra provider; provider tuning goes in installations/<inst>/addons/external-dns/values.yaml.
dns:
  provider: cloudflare                        # none | route53 | cloudflare
  domainFilters:                              # the only zones ExternalDNS may touch; the TXT owner is the cluster name
    - hetzner.example.com                     # VERIFY: a Cloudflare zone you own
