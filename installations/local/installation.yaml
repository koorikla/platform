# Installation "local": k3d mgmt + CAPD workload clusters on this machine.
# Consumed by charts/platform (root app values) and passed to every generated Application as `installation.*`.
installation:
  name: local
  repoURL: https://github.com/koorikla/platform.git
  revision: main
  githubOrg: https://github.com/koorikla      # repo-creds prefix (covers app repos too)
  domain: localhost                           # base domain for platform endpoints

# The management cluster itself (not CAPI-managed in this installation: k3d).
mgmt:
  name: mgmt
  provider: docker
  region: local
  environment: mgmt
  addons:                                     # addons.platform.koorikla.io/<addon> overrides for mgmt
    openbao: true                             # Istio mesh CA (OpenBao: one root + intermediate per mesh.groups entry)

secrets:
  backend: kubernetes                         # kubernetes | aws | vault
  kubernetes:
    namespace: platform-secrets               # seeded by `task secrets` (stand-in for a real vault)
  # githubGateApp.enabled (auto-build, PR previews): not set here - `task up`/`task secrets` put it on the root app from
  # whether promotion-gate-github (GITHUB_GATE_APP_*) is seeded; `false` here keeps them off (docs/forking.md, #192).
  workloadSeed:                               # local backend: copied from mgmt `platform` into each workload cluster
    keys: [openchoreo-observability]          # falco-webhook stays on mgmt (per-cluster tokens: charts/cluster falcoEscalation)
  # Every ghcr.io image this installation pulls is public: no registries.yaml / platform-ghcr.
  # Private images: true + GHCR_* (docs/forking.md).
  nodeRegistryAuth:
    enabled: false
  # Per-tenant SecretStores backed by OpenBao on mgmt: each cell namespace reads only kv-tenant-<project>.
  # Needs mgmt.addons.openbao and mesh members (docs/multicluster.md "Tenant secrets (OpenBao)").
  tenantStores:
    enabled: true

# Image registry (docs/build-plane.md). harbor: builds push to Harbor on mgmt and nodes pull through its proxy caches;
# external: builds push to external.repository, nodes pull upstream.
registry:
  type: harbor                                # harbor | external
  host: harbor.openchoreo.localhost:9443      # image refs, Harbor externalURL + Gateway listener; k3d publishes 9443
  appsProject: apps
  proxyCache:                                 # upstream -> Harbor proxy-cache project (k3s mirror rewrite)
    - { upstream: docker.io, project: dockerhub }
    - { upstream: ghcr.io, project: ghcr }
    - { upstream: quay.io, project: quay }
    - { upstream: registry.k8s.io, project: k8s }
    - { upstream: cr.openchoreo.dev, project: openchoreo }
    - { upstream: gcr.io, project: gcr }
  mirror:
    enabled: true                             # k3s registries.yaml mirrors (new machines only: bootstrap data)
  # Local only: CAPD nodes resolve the registry name to this container on docker network kind (k3d serverlb).
  nodeHostAlias: k3d-platform-mgmt-serverlb
  # Host pull-through caches that survive `task down`, so a rebuild pulls from disk; REGISTRY_CACHE=0 on `task up`
  # opts out (hack/registry-cache.sh, docs/dev-environment.md "Registry caches").
  hostCache:
    enabled: true
    mirrors:
      - { upstream: docker.io, remote: "https://registry-1.docker.io" }
      - { upstream: ghcr.io, remote: "https://ghcr.io" }
      - { upstream: quay.io, remote: "https://quay.io" }
      - { upstream: registry.k8s.io, remote: "https://registry.k8s.io" }
      - { upstream: gcr.io, remote: "https://gcr.io" }
      - { upstream: cr.openchoreo.dev, remote: "https://cr.openchoreo.dev" }
      - { upstream: cr.kgateway.dev, remote: "https://cr.kgateway.dev" }
      - { upstream: cr.agentgateway.dev, remote: "https://cr.agentgateway.dev" }
      - { upstream: reg.kyverno.io, remote: "https://reg.kyverno.io" }
      - { upstream: cr.fluentbit.io, remote: "https://cr.fluentbit.io" }
  external:
    repository: ghcr.io/koorikla              # used when type is external
    credentialsKey: platform-ghcr             # username, token

capi:
  providers:
    docker: true
    aws: false
    hetzner: false

openchoreo:
  controlPlane:
    host: openchoreo.localhost                 # console; api.<host>, thunder.<host> derive from it
    # clusterGatewayURL (agents dial it): chart default wss://cluster-gateway.openchoreo.localhost:8443/ws, resolved by coredns-local
  # Observability plane on mgmt (addon openchoreo-observability-plane) + data-plane telemetry (addon telemetry).
  # Endpoints per port: docs/observability.md.
  observability:
    enabled: true                              # false: no observabilityPlaneRef; disable the two addons too
    httpPort: 11080                            # k3d publishes 11080/11085 on the mgmt load balancer
    tlsPort: 11085
  # Workflow plane on mgmt (addon openchoreo-workflow-plane): Argo Workflows + cluster-agent, ClusterWorkflowPlane
  # `default`; build ClusterWorkflows in addon openchoreo-platform. docs/build-plane.md.
  workflowPlane:
    enabled: true                              # false: disable the addon and Backstage's workflow features
    # Auto-build of Components with spec.autoBuild: true: poll | webhook | none (docs/build-plane.md "Auto-build")
    autoBuild: poll                            # GitHub cannot reach a laptop: poll, nothing exposed

# Public DNS (addon external-dns, docs/dns.md): none locally, coredns-local resolves *.openchoreo.localhost.
dns:
  provider: none                               # none | route53 | cloudflare
  domainFilters: []

# Promotion gates (docs/promotion.md). Read by charts/tenant (per-environment Applications, Argo CD sync windows) and
# addon openchoreo-platform (production authz deny, promotion-gate ClusterWorkflow freeze check).
promotion:
  gatedEnvironments: [production]        # bindings change only by reviewed PR; developers denied in console/API/MCP
  restrictedGroups: [developers]
  bindingFile: release-bindings/{environment}.yaml
  freezeWindows:
    - name: weekend
      start: "Fri 16:00"
      end: "Mon 08:00"
      timeZone: Europe/Tallinn
      environments: [production]

# PR preview environments: each open PR of an opted-in Component gets Environment pr-<n>-<component> on `dataPlane`,
# removed when the PR closes or after `ttl` (docs/preview-environments.md).
previews:
  enabled: true
  dataPlane: dev1                              # ClusterDataPlane of the development tier
  ttl: 48h                                     # since the Environment was created (Go duration, hours)
  maxPerTenant: 2                              # concurrent previews per tenant (RAM-bound locally)
  requeueAfterSeconds: 120                     # pull request poll (no GitHub webhook locally)
  expiredLabel: preview-expired                # remove it from the PR for a fresh preview

# Istio mesh (docs/multicluster.md): one CA per group, a trust boundary; `local` holds dev1 and prod1 on purpose (one laptop).
# ca: where members reach OpenBao on mgmt; port == the k3d published port (bootstrap/k3d-mgmt.yaml).
mesh:
  groups: [local]
  ca:
    host: openbao.openchoreo.localhost
    port: 8200
